name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify opening assets
        shell: bash
        run: |
          set -euo pipefail
          test -s resources/cutscene_01_arrival.png
          test -s cut02_master.png
          test -s cutscene_03_first_echo.png

      - name: Fix CUT02 pseudo Live2D framing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("20260921-live2d1", "20260921-live2d2")

          # The exported part PNGs are cropped sources, so rendering each at 100vw/100vh
          # enlarged the face. Use the approved full composition as the aligned rig source.
          s = re.sub(
              r"CUT02_ASSETS=\[[^\]]+\]",
              "CUT02_ASSETS=['./cut02_master.png?v='+V]",
              s,
              count=1,
          )

          old_render = "return`<div class=\"shot cut02-shot\" data-scene=\"CUT02\"><div class=\"cut02-camera\"><div class=\"cut02-rig\">${img('./cut02_bg.png?v='+V,'cut02-layer cut02-bg','관리구역 배경')}${img('./cut02_torso.png?v='+V,'cut02-layer cut02-body','')}${img('./cut02_folder.png?v='+V,'cut02-layer cut02-folder','')}${img('./cut02_arms.png?v='+V,'cut02-layer cut02-arms','')}${img('./cut02_badge.png?v='+V,'cut02-layer cut02-badge','')}${img('./cut02_head_core.png?v='+V,'cut02-layer cut02-head',scene.alt)}${img('./cut02_hair_loose.png?v='+V,'cut02-layer cut02-hair','')}<div class=\"cut02-fx glass\"></div></div></div></div>`"
          new_render = "return`<div class=\"shot cut02-shot\" data-scene=\"CUT02\"><div class=\"live2d-camera\"><div class=\"live2d-rig\">${img(scene.src,'live2d-master',scene.alt)}${img(scene.src,'live2d-slice live2d-body','')}${img(scene.src,'live2d-slice live2d-folder','')}${img(scene.src,'live2d-slice live2d-head','')}${img(scene.src,'live2d-slice live2d-hair','')}<div class=\"cut02-fx glass\"></div></div></div></div>`"
          if old_render not in s:
              raise SystemExit('CUT02 render signature not found')
          s = s.replace(old_render, new_render, 1)

          old_preload = "Promise.all(CUT02_ASSETS.map((src,idx)=>preloadImage(src,'CUT02-'+idx))).then(parts=>({id:'CUT02',file:'layered',parts,loaded:true}))"
          s = s.replace(old_preload, "preloadImage(scene.src,'CUT02')", 1)
          s = s.replace("cut02Motion:'pseudo-live2d-v1'", "cut02Motion:'master-slice-live2d-v2'", 1)

          css = r'''
          /* master-slice pseudo Live2D: keep original composition, animate aligned regions only */
          .live2d-camera{position:absolute;inset:-1.1%;overflow:hidden;transform-origin:50% 48%;animation:l2CamIdle 9s ease-in-out infinite}
          .live2d-rig{position:absolute;inset:0}
          .live2d-master,.live2d-slice{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;user-select:none;-webkit-user-drag:none}
          .live2d-master{z-index:1}
          .live2d-slice{z-index:2;pointer-events:none;will-change:transform}
          .live2d-head{clip-path:polygon(22% 8%,78% 8%,76% 48%,24% 48%);transform-origin:50% 30%;animation:l2HeadIdle 5.8s ease-in-out infinite}
          .live2d-hair{clip-path:polygon(15% 4%,85% 4%,80% 55%,20% 55%);transform-origin:50% 28%;animation:l2HairIdle 5.8s ease-in-out infinite;opacity:.72}
          .live2d-body{clip-path:polygon(9% 37%,91% 37%,95% 88%,5% 88%);transform-origin:50% 58%;animation:l2BodyIdle 5.8s ease-in-out infinite}
          .live2d-folder{clip-path:polygon(8% 48%,92% 48%,96% 91%,4% 91%);transform-origin:50% 70%;animation:l2FolderIdle 6.1s ease-in-out infinite;opacity:.7}
          @keyframes l2CamIdle{0%,100%{transform:scale(1.004)}50%{transform:scale(1.011) translate3d(-1px,0,0)}}
          @keyframes l2HeadIdle{0%,100%{transform:none}50%{transform:translate3d(.35px,-.45px,0) rotate(.025deg)}}
          @keyframes l2HairIdle{0%,100%{transform:none}50%{transform:translate3d(.9px,.18px,0) rotate(.12deg)}}
          @keyframes l2BodyIdle{0%,100%{transform:none}50%{transform:translate3d(.6px,-.75px,0) rotate(-.045deg)}}
          @keyframes l2FolderIdle{0%,100%{transform:none}50%{transform:translate3d(1px,-.55px,0) rotate(-.08deg)}}
          .cut02-shot.speak-a .live2d-camera{animation:l2CamA .72s cubic-bezier(.18,.8,.24,1) both}.cut02-shot.speak-a .live2d-body{animation:l2BodyA .72s cubic-bezier(.18,.8,.24,1) both}.cut02-shot.speak-a .live2d-head{animation:l2HeadA .72s cubic-bezier(.18,.8,.24,1) both}.cut02-shot.speak-a .live2d-hair{animation:l2HairA .78s cubic-bezier(.18,.8,.24,1) both}.cut02-shot.speak-a .live2d-folder{animation:l2FolderA .8s cubic-bezier(.18,.8,.24,1) both}
          .cut02-shot.speak-b .live2d-camera{animation:l2CamB .76s cubic-bezier(.18,.8,.24,1) both}.cut02-shot.speak-b .live2d-body{animation:l2BodyB .76s cubic-bezier(.18,.8,.24,1) both}.cut02-shot.speak-b .live2d-head{animation:l2HeadB .76s cubic-bezier(.18,.8,.24,1) both}.cut02-shot.speak-b .live2d-hair{animation:l2HairB .82s cubic-bezier(.18,.8,.24,1) both}.cut02-shot.speak-b .live2d-folder{animation:l2FolderB .84s cubic-bezier(.18,.8,.24,1) both}
          .cut02-shot.speak-c .live2d-camera{animation:l2CamC .78s cubic-bezier(.18,.8,.24,1) both}.cut02-shot.speak-c .live2d-body{animation:l2BodyC .78s cubic-bezier(.18,.8,.24,1) both}.cut02-shot.speak-c .live2d-head{animation:l2HeadC .78s cubic-bezier(.18,.8,.24,1) both}.cut02-shot.speak-c .live2d-hair{animation:l2HairC .84s cubic-bezier(.18,.8,.24,1) both}.cut02-shot.speak-c .live2d-folder{animation:l2FolderC .86s cubic-bezier(.18,.8,.24,1) both}
          .cut02-shot.listen-a .live2d-camera{animation:l2ListenCamA 1.1s ease-in-out both}.cut02-shot.listen-a .live2d-head{animation:l2ListenHeadA 1.1s ease-in-out both}.cut02-shot.listen-a .live2d-body{animation:l2ListenBodyA 1.1s ease-in-out both}.cut02-shot.listen-a .live2d-hair{animation:l2ListenHairA 1.16s ease-in-out both}
          .cut02-shot.listen-b .live2d-camera{animation:l2ListenCamB 1.1s ease-in-out both}.cut02-shot.listen-b .live2d-head{animation:l2ListenHeadB 1.1s ease-in-out both}.cut02-shot.listen-b .live2d-body{animation:l2ListenBodyB 1.1s ease-in-out both}.cut02-shot.listen-b .live2d-hair{animation:l2ListenHairB 1.16s ease-in-out both}
          @keyframes l2CamA{0%{transform:scale(1.006)}48%{transform:scale(1.018) translate3d(-3px,-1px,0)}100%{transform:scale(1.009)}}@keyframes l2BodyA{0%{transform:none}48%{transform:translate3d(-1.9px,-1.2px,0) rotate(-.12deg)}100%{transform:none}}@keyframes l2HeadA{0%{transform:none}44%{transform:translate3d(-.8px,-.8px,0) rotate(-.06deg)}100%{transform:none}}@keyframes l2HairA{0%{transform:none}55%{transform:translate3d(.7px,.6px,0) rotate(.18deg)}100%{transform:none}}@keyframes l2FolderA{0%{transform:none}58%{transform:translate3d(-2.8px,-.7px,0) rotate(-.22deg)}100%{transform:none}}
          @keyframes l2CamB{0%{transform:scale(1.006)}48%{transform:scale(1.019) translate3d(3px,-1px,0)}100%{transform:scale(1.009)}}@keyframes l2BodyB{0%{transform:none}48%{transform:translate3d(2px,-.9px,0) rotate(.12deg)}100%{transform:none}}@keyframes l2HeadB{0%{transform:none}44%{transform:translate3d(.8px,-.6px,0) rotate(.055deg)}100%{transform:none}}@keyframes l2HairB{0%{transform:none}55%{transform:translate3d(-.6px,.5px,0) rotate(-.16deg)}100%{transform:none}}@keyframes l2FolderB{0%{transform:none}58%{transform:translate3d(2.9px,-.6px,0) rotate(.2deg)}100%{transform:none}}
          @keyframes l2CamC{0%{transform:scale(1.006)}35%{transform:scale(1.014) translate3d(-1px,1px,0)}62%{transform:scale(1.02) translate3d(2px,-2px,0)}100%{transform:scale(1.009)}}@keyframes l2BodyC{0%{transform:none}35%{transform:translate3d(-1px,1.2px,0) rotate(-.08deg)}62%{transform:translate3d(1.5px,-1.2px,0) rotate(.1deg)}100%{transform:none}}@keyframes l2HeadC{0%{transform:none}35%{transform:translate3d(-.3px,.4px,0)}62%{transform:translate3d(.65px,-.6px,0) rotate(.04deg)}100%{transform:none}}@keyframes l2HairC{0%{transform:none}45%{transform:translate3d(.55px,.7px,0) rotate(.14deg)}70%{transform:translate3d(-.3px,-.2px,0) rotate(-.1deg)}100%{transform:none}}@keyframes l2FolderC{0%{transform:none}42%{transform:translate3d(-1.5px,.7px,0) rotate(-.13deg)}68%{transform:translate3d(2px,-1.1px,0) rotate(.18deg)}100%{transform:none}}
          @keyframes l2ListenCamA{0%{transform:scale(1.007)}50%{transform:scale(1.014) translate3d(2px,0,0)}100%{transform:scale(1.008)}}@keyframes l2ListenHeadA{0%{transform:none}50%{transform:translate3d(.45px,.35px,0) rotate(.035deg)}100%{transform:none}}@keyframes l2ListenBodyA{0%{transform:none}50%{transform:translate3d(.7px,.55px,0) rotate(.035deg)}100%{transform:none}}@keyframes l2ListenHairA{0%{transform:none}55%{transform:translate3d(.35px,.45px,0) rotate(.1deg)}100%{transform:none}}
          @keyframes l2ListenCamB{0%{transform:scale(1.007)}50%{transform:scale(1.014) translate3d(-2px,.3px,0)}100%{transform:scale(1.008)}}@keyframes l2ListenHeadB{0%{transform:none}50%{transform:translate3d(-.4px,.35px,0) rotate(-.035deg)}100%{transform:none}}@keyframes l2ListenBodyB{0%{transform:none}50%{transform:translate3d(-.65px,.55px,0) rotate(-.035deg)}100%{transform:none}}@keyframes l2ListenHairB{0%{transform:none}55%{transform:translate3d(-.35px,.45px,0) rotate(-.1deg)}100%{transform:none}}
          '''
          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
