name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify opening assets
        shell: bash
        run: |
          set -euo pipefail
          test -s resources/cutscene_01_arrival.png
          test -s cut02_master.png
          test -s cutscene_03_first_echo.png

      - name: Apply stronger dialogue motion and speaker contrast
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r"const V='[^']+';", "const V='20260921-dialogue-motion2';", text, count=1)

          css = r'''
          /* dialogue-motion-v2 */
          .caption.hajin-turn{align-items:flex-start}
          .caption.player-turn{align-items:flex-end;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(5,13,19,.84) 48%,rgba(4,12,18,.97))}
          .speaker{padding:5px 9px;border-radius:999px;background:rgba(5,6,7,.68);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
          .caption.hajin-turn .speaker{color:#f1f2f3;font-weight:750;letter-spacing:.09em;border:1px solid rgba(255,255,255,.20)}
          .caption.player-turn .speaker{color:#b9d6ea;font-size:11px;font-weight:800;letter-spacing:.16em;text-align:right;border:1px solid rgba(124,181,219,.56);background:rgba(8,24,35,.80)}
          .caption.hajin-turn .line{width:94%;max-width:94%;padding:10px 12px;border-left:3px solid rgba(235,238,241,.55);border-radius:0 9px 9px 0;background:linear-gradient(90deg,rgba(19,20,22,.70),rgba(7,8,9,.16));text-align:left;color:#f7f7f6}
          .caption.player-turn .line{width:90%;max-width:90%;min-height:54px;padding:10px 12px;border-right:3px solid rgba(112,183,228,.86);border-radius:9px 0 0 9px;background:linear-gradient(90deg,rgba(5,13,19,.20),rgba(9,31,44,.78));text-align:right;color:#e4f3fc;font-size:18px}
          .caption.hajin-turn .hint{align-self:flex-start}
          .caption.player-turn .hint{align-self:flex-end;text-align:right;color:#7f9eb3}
          .choices{align-items:stretch}
          .choices::before{content:'관리관 · 당신';display:block;margin:0 5px 3px;color:#b9d6ea;font-size:10px;font-weight:800;letter-spacing:.16em;text-align:right}
          .choice{border-left-color:rgba(255,255,255,.10);border-right:3px solid rgba(112,183,228,.82);background:linear-gradient(90deg,rgba(7,9,11,.88),rgba(9,30,43,.95));text-align:right;color:#e7f3fa}

          .cut02-shot.beat-a .cut02-frame{animation:cut02TalkCamA .82s cubic-bezier(.2,.78,.22,1) both}
          .cut02-shot.beat-b .cut02-frame{animation:cut02TalkCamB .94s cubic-bezier(.2,.72,.22,1) both}
          .cut02-shot.beat-c .cut02-frame{animation:cut02TalkCamC .88s cubic-bezier(.2,.75,.22,1) both}
          .cut02-shot.listening .cut02-frame{animation:cut02ListenCam .72s ease-out both}

          .cut02-shot.beat-a .motion-head{animation:cut02BeatHeadA .82s cubic-bezier(.2,.78,.22,1) both}
          .cut02-shot.beat-a .motion-shoulder{animation:cut02BeatShoulderA .82s cubic-bezier(.2,.78,.22,1) both}
          .cut02-shot.beat-a .motion-coat{animation:cut02BeatBodyA .82s cubic-bezier(.2,.78,.22,1) both}
          .cut02-shot.beat-a .motion-folder{animation:cut02BeatFolderA .82s cubic-bezier(.2,.78,.22,1) both}
          .cut02-shot.beat-a .motion-right-arm{animation:cut02BeatArmA .82s cubic-bezier(.2,.78,.22,1) both}

          .cut02-shot.beat-b .motion-head{animation:cut02BeatHeadB .94s cubic-bezier(.2,.72,.22,1) both}
          .cut02-shot.beat-b .motion-shoulder{animation:cut02BeatShoulderB .94s cubic-bezier(.2,.72,.22,1) both}
          .cut02-shot.beat-b .motion-coat{animation:cut02BeatBodyB .94s cubic-bezier(.2,.72,.22,1) both}
          .cut02-shot.beat-b .motion-right-arm{animation:cut02BeatArmB .94s cubic-bezier(.2,.72,.22,1) both}
          .cut02-shot.beat-b .motion-folder{animation:cut02BeatFolderB .94s cubic-bezier(.2,.72,.22,1) both}

          .cut02-shot.beat-c .motion-head{animation:cut02BeatHeadC .88s cubic-bezier(.2,.75,.22,1) both}
          .cut02-shot.beat-c .motion-shoulder{animation:cut02BeatShoulderC .88s cubic-bezier(.2,.75,.22,1) both}
          .cut02-shot.beat-c .motion-coat{animation:cut02BeatBodyC .88s cubic-bezier(.2,.75,.22,1) both}
          .cut02-shot.beat-c .motion-folder{animation:cut02BeatFolderC .88s cubic-bezier(.2,.75,.22,1) both}

          .cut02-shot.listening .motion-head,.cut02-shot.listening .motion-shoulder,.cut02-shot.listening .motion-coat,.cut02-shot.listening .motion-right-arm,.cut02-shot.listening .motion-folder,.cut02-shot.listening .motion-lower{animation:none!important}
          .cut02-shot.listening .motion-head{transform:translate3d(.45px,1.15px,0) rotate(.055deg)}
          .cut02-shot.listening .motion-shoulder{transform:translate3d(.1px,.75px,0)}
          .cut02-shot.listening .motion-folder{transform:translate3d(-.35px,.4px,0) rotate(.04deg)}

          @keyframes cut02TalkCamA{0%{transform:scale(1.012) translate3d(-1px,-2px,0)}40%{transform:scale(1.018) translate3d(-2px,-5px,0)}100%{transform:scale(1.014) translate3d(-1px,-3px,0)}}
          @keyframes cut02TalkCamB{0%{transform:scale(1.014) translate3d(-1px,-3px,0)}46%{transform:scale(1.019) translate3d(1px,-4px,0)}100%{transform:scale(1.014) translate3d(0,-3px,0)}}
          @keyframes cut02TalkCamC{0%{transform:scale(1.014) translate3d(0,-3px,0)}42%{transform:scale(1.016) translate3d(-2px,-1px,0)}100%{transform:scale(1.014) translate3d(-1px,-3px,0)}}
          @keyframes cut02ListenCam{0%{transform:scale(1.014) translate3d(-1px,-3px,0)}100%{transform:scale(1.010) translate3d(0,-1px,0)}}

          @keyframes cut02BeatHeadA{0%,100%{transform:translate3d(0,0,0) rotate(0)}42%{transform:translate3d(-.6px,-2.8px,0) rotate(-.14deg)}}
          @keyframes cut02BeatShoulderA{0%,100%{transform:translate3d(0,0,0) rotate(0)}42%{transform:translate3d(.8px,-3.9px,0) rotate(.14deg)}}
          @keyframes cut02BeatBodyA{0%,100%{transform:translate3d(0,0,0)}42%{transform:translate3d(.6px,-3.2px,0)}}
          @keyframes cut02BeatFolderA{0%,100%{transform:translate3d(0,0,0) rotate(0)}46%{transform:translate3d(1.4px,-2.3px,0) rotate(-.2deg)}}
          @keyframes cut02BeatArmA{0%,100%{transform:translate3d(0,0,0) rotate(0)}46%{transform:translate3d(1.2px,-2px,0) rotate(-.13deg)}}

          @keyframes cut02BeatHeadB{0%,100%{transform:translate3d(0,0,0) rotate(0)}48%{transform:translate3d(1px,-1.8px,0) rotate(.13deg)}}
          @keyframes cut02BeatShoulderB{0%,100%{transform:translate3d(0,0,0)}48%{transform:translate3d(1.8px,-3px,0)}}
          @keyframes cut02BeatBodyB{0%,100%{transform:translate3d(0,0,0) scaleY(1)}48%{transform:translate3d(1.4px,-3.6px,0) scaleY(1.004)}}
          @keyframes cut02BeatArmB{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(2.7px,-2.2px,0) rotate(-.25deg)}}
          @keyframes cut02BeatFolderB{0%,100%{transform:translate3d(0,0,0) rotate(0)}52%{transform:translate3d(1.8px,-2px,0) rotate(-.18deg)}}

          @keyframes cut02BeatHeadC{0%,100%{transform:translate3d(0,0,0) rotate(0)}38%{transform:translate3d(-.4px,1.8px,0) rotate(-.11deg)}62%{transform:translate3d(.25px,-.8px,0) rotate(.045deg)}}
          @keyframes cut02BeatShoulderC{0%,100%{transform:translate3d(0,0,0)}45%{transform:translate3d(-1px,1.7px,0)}}
          @keyframes cut02BeatBodyC{0%,100%{transform:translate3d(0,0,0)}45%{transform:translate3d(-.8px,1.4px,0)}}
          @keyframes cut02BeatFolderC{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(-1.6px,1.4px,0) rotate(.19deg)}}
          '''
          text = text.replace('</style>', css + '\n</style>')

          text = text.replace("let si=0,queue=[],waitingChoice=false,locked=false,finished=false;", "let si=0,queue=[],waitingChoice=false,locked=false,finished=false,hajinBeat=0;")

          old_dialogue = "function setDialogue(item){caption.classList.remove('show');setTimeout(()=>{if(!document.body.contains(caption))return;speaker.textContent=item.speaker;speaker.classList.toggle('player',item.speaker==='관리관');line.textContent=item.text;hint.textContent='화면을 터치하여 진행';caption.classList.add('show')},80)}"
          new_dialogue = "function setDialogue(item){const isPlayer=item.speaker==='관리관';caption.classList.remove('show','player-turn','hajin-turn');const cut02=document.querySelector('[data-scene=\\\"CUT02\\\"]');if(cut02&&cut02.classList.contains('active')){cut02.classList.remove('beat-a','beat-b','beat-c','listening');void cut02.offsetWidth;if(item.speaker==='윤하진'){const beats=['beat-a','beat-b','beat-c'];cut02.classList.add(beats[hajinBeat++%beats.length])}else if(isPlayer){cut02.classList.add('listening')}}setTimeout(()=>{if(!document.body.contains(caption))return;speaker.textContent=isPlayer?'관리관 · 당신':item.speaker;speaker.classList.toggle('player',isPlayer);caption.classList.toggle('player-turn',isPlayer);caption.classList.toggle('hajin-turn',item.speaker==='윤하진');line.textContent=item.text;hint.textContent='화면을 터치하여 진행';caption.classList.add('show')},80)}"
          if old_dialogue not in text:
              raise SystemExit('setDialogue source did not match expected briefing build')
          text = text.replace(old_dialogue, new_dialogue)
          text = text.replace("interactiveBriefing:true,badgeSeparateLayer:false", "interactiveBriefing:true,dialogueMotionV2:true,speakerContrast:true,badgeSeparateLayer:false")
          path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
