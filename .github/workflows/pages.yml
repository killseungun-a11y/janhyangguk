name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cutscene assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources

          if [ -s resources/cutscene_01_arrival.webp ] && [ -s resources/cutscene_02_hajin.webp ] && [ -s resources/cutscene_03_first_echo.webp ]; then
            echo 'Using vendored repository assets.'
            exit 0
          fi

          mkdir -p /tmp/janhyangguk-assets
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://app-dgayh3.v2.appdeploy.ai/resources/cutscene_01_arrival.png' \
            --output /tmp/janhyangguk-assets/cutscene_01_arrival.png
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://app-dgayh3.v2.appdeploy.ai/resources/cutscene_02_hajin.png' \
            --output /tmp/janhyangguk-assets/cutscene_02_hajin.png
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://app-dgayh3.v2.appdeploy.ai/resources/cutscene_03_first_echo.png' \
            --output /tmp/janhyangguk-assets/cutscene_03_first_echo.png

          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          cwebp -quiet -lossless -z 9 /tmp/janhyangguk-assets/cutscene_01_arrival.png -o resources/cutscene_01_arrival.webp
          cwebp -quiet -lossless -z 9 /tmp/janhyangguk-assets/cutscene_02_hajin.png -o resources/cutscene_02_hajin.webp
          cwebp -quiet -lossless -z 9 /tmp/janhyangguk-assets/cutscene_03_first_echo.png -o resources/cutscene_03_first_echo.webp

          test -s resources/cutscene_01_arrival.webp
          test -s resources/cutscene_02_hajin.webp
          test -s resources/cutscene_03_first_echo.webp

      - name: Persist cutscene assets in repository
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain resources | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add resources
            git commit -m 'chore: vendor cutscene assets'
            git push
          else
            echo 'Assets already vendored.'
          fi

      - name: Normalize animation CSS for mobile browsers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'calc(var(--look-x) * -.35 - .8px)': 'calc(var(--look-x) - .8px)',
              'calc(var(--look-x) * -.35)': 'var(--look-x)',
              'calc(var(--look-x) * .24 + .8px)': 'calc(var(--look-x) + .8px)',
              'calc(var(--look-x) * .24)': 'var(--look-x)',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
