name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare canonical PNG cutscene assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources

          if [ ! -s resources/cutscene_01_arrival.png ] || [ ! -s resources/cutscene_02_hajin.png ] || [ ! -s resources/cutscene_03_first_echo.png ]; then
            curl --fail --location --retry 4 --retry-delay 2 \
              'https://app-dgayh3.v2.appdeploy.ai/resources/cutscene_01_arrival.png' \
              --output resources/cutscene_01_arrival.png
            curl --fail --location --retry 4 --retry-delay 2 \
              'https://app-dgayh3.v2.appdeploy.ai/resources/cutscene_02_hajin.png' \
              --output resources/cutscene_02_hajin.png
            curl --fail --location --retry 4 --retry-delay 2 \
              'https://app-dgayh3.v2.appdeploy.ai/resources/cutscene_03_first_echo.png' \
              --output resources/cutscene_03_first_echo.png
          fi

          cat <<'EOF' | sha256sum -c -
          dadb75fadbf8949c17e045aeb27b84c07eb89c3685e1e2dd3c6e9bb904107fb3  resources/cutscene_01_arrival.png
          ec829e4d0c945a6f5dc2051249b325c018a4ecd4ee2d68f706f5a6bf17f6000a  resources/cutscene_02_hajin.png
          9f567b107b35094c1a8b4fc30f1dff76357c9955159f4d4f70fc185a6578ed93  resources/cutscene_03_first_echo.png
          EOF

      - name: Switch runtime to PNG originals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('cutscene_01_arrival.webp', 'cutscene_01_arrival.png')
          text = text.replace('cutscene_02_hajin.webp', 'cutscene_02_hajin.png')
          text = text.replace('cutscene_03_first_echo.webp', 'cutscene_03_first_echo.png')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Persist canonical PNG assets in repository
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain -- resources index.html | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add resources/cutscene_01_arrival.png resources/cutscene_02_hajin.png resources/cutscene_03_first_echo.png index.html
            git commit -m 'chore: vendor canonical PNG cutscene assets'
            git push
          else
            echo 'Canonical PNG assets already vendored.'
          fi

      - name: Normalize animation CSS for mobile browsers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'calc(var(--look-x) * -.35 - .8px)': 'calc(var(--look-x) - .8px)',
              'calc(var(--look-x) * -.35)': 'var(--look-x)',
              'calc(var(--look-x) * .24 + .8px)': 'calc(var(--look-x) + .8px)',
              'calc(var(--look-x) * .24)': 'var(--look-x)',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
