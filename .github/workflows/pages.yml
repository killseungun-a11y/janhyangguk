name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify opening assets
        shell: bash
        run: |
          set -euo pipefail
          test -s resources/cutscene_01_arrival.png
          test -s cut02_master.png
          echo 'dadb75fadbf8949c17e045aeb27b84c07eb89c3685e1e2dd3c6e9bb904107fb3  resources/cutscene_01_arrival.png' | sha256sum -c -

      - name: Rebuild approved CUT03 artwork
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .cut03_asset/part00.b64 \
            .cut03_asset/part01.b64 \
            .cut03_asset/part02.b64 \
            .cut03_asset/part03.b64 \
            .cut03_asset/part04.b64 \
            .cut03_asset/part041.b64 \
            .cut03_asset/part042.b64 \
            .cut03_asset/part043.b64 \
            .cut03_asset/part044.b64 \
            .cut03_asset/part05.b64 \
            .cut03_asset/part051.b64 \
            .cut03_asset/part052.b64 \
            .cut03_asset/part053.b64 \
            .cut03_asset/part054.b64 \
            | tr -d '\n\r' | base64 --decode > cutscene_03_first_echo_backview.webp
          echo '4278c21d22bd4e837c8d5a96a43a28ff02e675d107317d249f2948d435b05a53  cutscene_03_first_echo_backview.webp' | sha256sum -c -

      - name: Apply opening direction patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r"const V='[^']+';", "const V='20260921-cut03-backview';", text, count=1)
          text = text.replace("src:'./cutscene_03_first_echo.png?v='+V", "src:'./cutscene_03_first_echo_backview.webp?v='+V")
          text = text.replace("dialogues:['저게 첫 번째예요.']", "dialogues:['첫 번째입니다.','한 획.']")
          text = text.replace("alt:'관리실 CCTV로 첫 잔향 한 획을 확인하는 장면'", "alt:'윤하진이 격실 01의 첫 잔향 한 획을 바라보는 장면'")

          if 'cut03-shot' not in text:
              old_render = "if(scene.id!=='CUT02')return `<div class=\"shot image-shot\" data-scene=\"${scene.id}\">${img(scene.src,'scene-img',scene.alt)}</div>`;"
              new_render = "if(scene.id==='CUT03')return `<div class=\"shot image-shot cut03-shot\" data-scene=\"${scene.id}\">${img(scene.src,'scene-img cut03-img',scene.alt)}</div>`;if(scene.id!=='CUT02')return `<div class=\"shot image-shot\" data-scene=\"${scene.id}\">${img(scene.src,'scene-img',scene.alt)}</div>`;"
              text = text.replace(old_render, new_render)

          if 'motion-head' not in text:
              old_head = "${img(s,'cut02-img cut02-base',scene.alt)}${img(s,'cut02-img cut02-motion motion-shoulder','')}"
              new_head = "${img(s,'cut02-img cut02-base',scene.alt)}${img(s,'cut02-img cut02-motion motion-head','')}${img(s,'cut02-img cut02-motion motion-shoulder','')}"
              text = text.replace(old_head, new_head)

          marker = '/* vNext: natural Hajin motion + approved CUT03 back-view */'
          if marker not in text:
              override = r'''
          /* vNext: natural Hajin motion + approved CUT03 back-view */
          .cut02-motion{opacity:.56;filter:brightness(1.006) contrast(1.003)}
          .cut02-shot.active .cut02-frame{animation:cut02Camera 9s cubic-bezier(.2,.6,.2,1) both}
          .motion-head{clip-path:ellipse(29% 29% at 48% 27%);transform-origin:48% 31%;animation:headMove 6s ease-in-out infinite;z-index:4}
          .motion-shoulder{animation:shoulderMove 6s ease-in-out infinite}
          .motion-coat{animation:coatMove 6s ease-in-out infinite}
          .motion-right-arm{animation:rightArmMove 6.15s ease-in-out infinite}
          .motion-folder{animation:folderMove 6.25s ease-in-out infinite}
          .motion-lower{animation:lowerMove 6.4s ease-in-out infinite}
          @keyframes cut02Camera{0%{transform:scale(1) translate3d(0,0,0)}100%{transform:scale(1.012) translate3d(-1px,-2px,0)}}
          @keyframes headMove{0%,100%{transform:translate3d(0,0,0) rotate(0)}42%{transform:translate3d(.12px,-.34px,0) rotate(-.04deg)}58%{transform:translate3d(.18px,-.46px,0) rotate(-.055deg)}}
          @keyframes shoulderMove{0%,100%{transform:translate3d(0,0,0) rotate(0)}42%{transform:translate3d(.35px,-.9px,0) rotate(.05deg)}58%{transform:translate3d(.5px,-1.25px,0) rotate(.07deg)}}
          @keyframes coatMove{0%,100%{transform:translate3d(0,0,0) scaleY(1)}42%{transform:translate3d(.35px,-1.15px,0) scaleY(1.0013)}58%{transform:translate3d(.55px,-1.65px,0) scaleY(1.002)}}
          @keyframes rightArmMove{0%,100%{transform:translate3d(0,0,0) rotate(0)}45%{transform:translate3d(.5px,-.55px,0) rotate(-.07deg)}60%{transform:translate3d(.8px,-.85px,0) rotate(-.11deg)}}
          @keyframes folderMove{0%,100%{transform:translate3d(0,0,0) rotate(0)}47%{transform:translate3d(.45px,-.65px,0) rotate(-.09deg)}62%{transform:translate3d(.7px,-1px,0) rotate(-.14deg)}}
          @keyframes lowerMove{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-.35px,-.8px,0)}}
          .cut03-shot.active{animation:none}
          .cut03-img{object-position:50% 50%;transform:scale(1.012);transform-origin:55% 43%;will-change:transform}
          .cut03-shot.active .cut03-img{animation:cut03Focus 8s cubic-bezier(.2,.6,.2,1) both}
          @keyframes cut03Focus{0%{transform:scale(1.012) translate3d(0,0,0)}100%{transform:scale(1.035) translate3d(-.25%,-.15%,0)}}
          .stage[data-env=cctv] .noise{opacity:.32}
          .stage[data-env=cctv] .scanline{opacity:.30}
          '''
              text = text.replace('</style>', override + '\n</style>')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Persist approved CUT03 asset and runtime patch
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain -- index.html cutscene_03_first_echo_backview.webp | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html cutscene_03_first_echo_backview.webp
            git commit -m 'feat: vendor approved CUT03 back-view scene'
            git push
          else
            echo 'Approved CUT03 asset already persisted.'
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
