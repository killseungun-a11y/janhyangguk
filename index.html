<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050607">
<title>잔향국 · 동부 제6관리소</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#f0f0f0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;touch-action:manipulation}
button{font:inherit}
.preload,.fatal{width:100vw;height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;background:#050607}
.preload-mark{width:22px;height:22px;border:1px solid #737981;border-right-color:transparent;border-radius:50%;animation:spin .9s linear infinite;margin:auto}
.preload p{margin:14px 0 0;color:#92979e;font-size:12px;letter-spacing:.14em}
@keyframes spin{to{transform:rotate(360deg)}}
.fatal button{min-width:140px;min-height:44px;margin-top:22px;border:1px solid #474d55;border-radius:10px;background:#111418;color:#eef0f2}

.stage{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#000;isolation:isolate}
.shot{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .35s ease}
.shot.active{opacity:1}
.scene-img,.cut02-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;user-select:none;-webkit-user-drag:none}
.image-shot.active{animation:cameraStill 9s ease-out both}
@keyframes cameraStill{from{transform:scale(1)}to{transform:scale(1.018)}}

/* CUT02 — 단일 완성 프레임만 표시. 파츠 레이어 없음. */
.cut02-visual{position:absolute;inset:-1.2%;overflow:hidden;transform-origin:50% 44%;will-change:transform;animation:cut02Idle 9s ease-in-out infinite}
.cut02-frame{z-index:1;will-change:filter}
.cut02-fx{position:absolute;inset:0;z-index:2;pointer-events:none}
@keyframes cut02Idle{0%,100%{transform:scale(1.004) translate3d(0,0,0)}50%{transform:scale(1.011) translate3d(-1.5px,0,0)}}
.cut02-shot.talk-a .cut02-visual{animation:talkA .72s cubic-bezier(.18,.78,.22,1) both}
.cut02-shot.talk-b .cut02-visual{animation:talkB .76s cubic-bezier(.18,.78,.22,1) both}
.cut02-shot.talk-c .cut02-visual{animation:talkC .74s cubic-bezier(.18,.78,.22,1) both}
.cut02-shot.listening .cut02-visual{animation:listen .9s ease-out both}
.cut02-shot.emphasis .cut02-visual{animation:emphasis .88s cubic-bezier(.16,.76,.2,1) both}
@keyframes talkA{0%{transform:scale(1.006) translateX(0)}55%{transform:scale(1.026) translateX(-5px)}100%{transform:scale(1.014) translateX(-1px)}}
@keyframes talkB{0%{transform:scale(1.006) translateX(0)}55%{transform:scale(1.025) translateX(5px)}100%{transform:scale(1.014) translateX(1px)}}
@keyframes talkC{0%{transform:scale(1.007) translateX(0)}45%{transform:scale(1.019) translateX(-2px)}72%{transform:scale(1.026) translateX(2px)}100%{transform:scale(1.014)}}
@keyframes listen{from{transform:scale(1.014)}to{transform:scale(1.005) translateX(2px)}}
@keyframes emphasis{0%{transform:scale(1.01)}60%{transform:scale(1.034) translateX(-3px)}100%{transform:scale(1.02) translateX(-1px)}}
.cut02-shot.state-sad .cut02-frame{filter:brightness(.94) saturate(.86)}
.cut02-shot.state-surprise .cut02-frame{filter:brightness(1.035) contrast(1.025)}
.cut02-shot.state-determined .cut02-frame{filter:contrast(1.075) brightness(.98)}

.cut03-img{transform:scale(1.008);transform-origin:55% 43%;will-change:transform}
.cut03-shot.active .cut03-img{animation:cut03Focus 9s cubic-bezier(.2,.6,.2,1) both}
@keyframes cut03Focus{0%{transform:scale(1.008)}100%{transform:scale(1.03) translate3d(-.2%,-.12%,0)}}

.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 0 54%,rgba(255,255,255,.015) 58%,transparent 62%);mix-blend-mode:screen;animation:glass 8s ease-in-out infinite}
@keyframes glass{0%,75%,100%{opacity:.14;transform:translateX(-5%)}88%{opacity:.32;transform:translateX(5%)}}
.rain,.grain,.noise,.scanline,.flicker{position:absolute;inset:0;pointer-events:none}
.rain{opacity:0;background-image:repeating-linear-gradient(105deg,transparent 0 18px,rgba(255,255,255,.1) 19px,transparent 20px 38px);background-size:170px 170px;animation:rain 1.5s linear infinite;mix-blend-mode:screen;transition:opacity .4s}
.stage[data-env=rain] .rain{opacity:.18}
@keyframes rain{to{background-position:-80px 170px}}
.grain{opacity:.04;background-image:radial-gradient(rgba(255,255,255,.26) .45px,transparent .6px);background-size:4px 4px;animation:grain .2s steps(2) infinite}
@keyframes grain{50%{transform:translate(.8%,-.8%)}}
.noise{opacity:0;background-image:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(255,255,255,.035) 4px)}
.stage[data-env=monitor] .noise{opacity:.14}
.stage[data-env=cctv] .noise{opacity:.3}
.scanline{opacity:0;background:linear-gradient(to bottom,transparent 0 38%,rgba(224,239,244,.09) 42%,transparent 46%);animation:scan 3.2s linear infinite}
.stage[data-env=cctv] .scanline{opacity:.28}
@keyframes scan{from{transform:translateY(-60%)}to{transform:translateY(80%)}}
.flicker{background:rgba(255,255,255,0);transition:background .08s}
.flicker.on{background:rgba(255,255,255,.055)}
.warning{position:absolute;right:5vw;top:8vh;width:8px;height:8px;border-radius:50%;background:#941b1b;box-shadow:0 0 16px rgba(207,30,30,.72);opacity:.16;animation:warning 2.9s ease-in-out infinite}
@keyframes warning{50%{opacity:.78}}

.caption{position:absolute;left:0;right:0;bottom:0;min-height:25vh;padding:18px 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent,rgba(0,0,0,.7) 28%,rgba(0,0,0,.95));z-index:20;pointer-events:none}
.caption.hajin-turn{align-items:flex-start}
.caption.player-turn{align-items:flex-end;background:linear-gradient(90deg,rgba(0,0,0,.58),rgba(5,14,21,.82) 50%,rgba(4,13,20,.96))}
.speaker{margin-bottom:8px;font-size:12px;font-weight:750;letter-spacing:.1em;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.48)}
.caption.hajin-turn .speaker{color:#f0f1f2;border:1px solid rgba(255,255,255,.16)}
.caption.player-turn .speaker{color:#afd1e8;border:1px solid rgba(124,174,210,.34);text-align:right}
.line{min-height:62px;font-size:19px;line-height:1.55;text-shadow:0 1px 9px #000;word-break:keep-all}
.caption.hajin-turn .line{width:94%;padding:9px 0 9px 12px;border-left:2px solid rgba(238,240,242,.42);text-align:left;color:#f4f4f3}
.caption.player-turn .line{width:88%;padding:9px 12px 9px 0;border-right:2px solid rgba(126,181,220,.8);text-align:right;color:#dcecf7}
.hint{margin-top:8px;color:#8f959c;font-size:11px}
.caption.player-turn .hint{align-self:flex-end;color:#71899a}
.toplabel{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;z-index:20;color:rgba(255,255,255,.72);font-size:11px;letter-spacing:.14em;text-shadow:0 2px 8px #000}
.skip{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;z-index:30;min-width:58px;min-height:44px;padding:10px 14px;border:1px solid rgba(255,255,255,.24);border-radius:18px;background:rgba(0,0,0,.52);color:#dedfe1;font-size:12px}
.tap{position:absolute;inset:0;z-index:20;border:0;background:transparent;-webkit-tap-highlight-color:transparent}
.choices{position:absolute;left:16px;right:16px;bottom:max(180px,25vh);z-index:35;display:flex;flex-direction:column;gap:9px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .14s,transform .14s}
.choices.show{opacity:1;transform:none;pointer-events:auto}
.choices::before{content:'관리관 · 당신';display:block;margin:0 4px 2px;color:#9fc7e2;font-size:10px;font-weight:750;letter-spacing:.14em;text-align:right}
.choice{min-height:50px;padding:12px 14px;border:1px solid rgba(255,255,255,.14);border-right:2px solid rgba(126,181,220,.75);border-radius:10px;background:linear-gradient(90deg,rgba(7,9,11,.88),rgba(9,21,29,.94));color:#e2edf5;text-align:right;font-size:14px;line-height:1.4;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.choice:active{background:rgba(35,39,43,.94);transform:scale(.995)}
.fade{position:absolute;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .38s}
.fade.on{opacity:1}
@media(min-width:700px){.stage{max-width:430px;margin:auto}}
</style>
</head>
<body>
<div id="app"><main class="preload"><div><div class="preload-mark"></div><p>관리소 연결 중</p></div></main></div>
<script>
(()=>{
const MANAGEMENT_URL='./management/';
const V='20260922-expression5';
const L=(speaker,text)=>({type:'line',speaker,text});
const FRAME={};
const SPRITE_STATES=['neutral','talk1','sad','surprise','determined'];
const SPRITE_FILE='talk1.b64';

const scenes=[
{id:'CUT01',src:'./assets/cutscenes/cutscene_01_arrival.png?v='+V,top:'동부 제6관리소',env:'rain',alt:'비가 내리는 동부 제6관리소 출입구',script:[L('안내','동부 제6관리소.')]},
{id:'CUT02',src:'./assets/cutscenes/cut02_master.png?v='+V,top:'관리구역 · 내부',env:'monitor',alt:'관리구역 내부에서 윤하진을 처음 만나는 장면',script:[
L('윤하진','……관리관님?'),
L('윤하진','맞으시죠. 윤하진입니다.'),
L('윤하진','오셔서 다행이에요. 일단 안으로 들어오세요.'),
L('관리관','여기…… 사람은 없는 겁니까?'),
L('윤하진','지금은 거의요.'),
L('윤하진','사흘 전부터 격실 쪽 사고가 연달아 났습니다.'),
L('윤하진','다친 사람은 빠졌고, 먼저 철수한 사람도 있어요.'),
L('윤하진','아직 연락이 안 되는 사람도 있고요.'),
L('관리관','그래서 제가 여기 온 겁니까?'),
L('윤하진','네. 관리관님은 밖에서 격실을 봐주시면 됩니다.'),
L('윤하진','누굴 투입할지, 어떤 작업을 시킬지 정하고.'),
L('윤하진','작업 중 상태가 이상하면 중단시키는 것까지요.'),
{type:'choice',options:[
{label:'상태가 이상하다는 건 뭘 보고 압니까?',lines:[L('관리관','상태가 이상하다는 건 뭘 보고 압니까?'),L('윤하진','사람부터 보시면 됩니다.'),L('윤하진','말이 늦어지거나, 행동이 평소랑 달라지면 일단 의심하세요.')]},
{label:'중단은 제가 바로 결정해도 됩니까?',lines:[L('관리관','중단은 제가 바로 결정해도 됩니까?'),L('윤하진','네. 그건 관리관님 판단입니다.'),L('윤하진','안에서 더 해보겠다고 해도, 밖에서 위험해 보이면 끊으시면 돼요.')]}
],after:[
L('윤하진','그리고…… 하나만 부탁드릴게요.'),
L('윤하진','제가 격실 안에 있을 때, 제가 괜찮다고 해도 그대로 믿진 마세요.'),
L('윤하진','안에 있으면 본인이 이상해진 걸 못 알아챌 때가 있어요.'),
L('윤하진','밖에서 이상해 보이면 그냥 끊어주세요.'),
L('관리관','알겠습니다.'),
L('윤하진','그럼 하나 보여드릴게요.'),
L('윤하진','저거부터 보죠.')
]}
]},
{id:'CUT03',src:'./assets/cutscenes/cutscene_03_first_echo.png?v='+V,top:'관리실 · 격실 01',env:'cctv',alt:'윤하진이 격실 01의 첫 잔향 한 획을 바라보는 장면',script:[
L('윤하진','격실 01.'),
L('윤하진','식별명은 ‘한 획’.'),
L('윤하진','기록은 몇 건 남아 있지만, 그대로 믿진 마세요.'),
{type:'choice',options:[
{label:'첫 작업은 뭘 시키면 됩니까?',lines:[L('관리관','첫 작업은 뭘 시키면 됩니까?'),L('윤하진','아직 정답은 없습니다.'),L('윤하진','작업 하나를 고르고, 반응을 기록하면서 규칙을 찾아야 해요.')]},
{label:'중단 기준부터 정하죠.',lines:[L('관리관','중단 기준부터 정하죠.'),L('윤하진','제 상태가 먼저입니다.'),L('윤하진','말이나 행동이 달라지면 중단. 격실 자체가 변하면 더 빨리요.')]}
],after:[L('윤하진','제가 들어갈게요.'),L('윤하진','관리관님은 모니터 봐주세요.'),L('윤하진','준비되셨으면…… 시작하죠.')]} 
]}
];

const app=document.querySelector('#app');
window.__CUTSCENE_QA__={assets:[],activeScene:'PRELOAD',cut03Rendered:false,interactiveBriefing:true,ghostFreeCut02:true,speakerContrast:true,dialogueSwap:'instant',cut02Motion:'full-frame-sprite-v5'};

const img=(src,cls,alt='')=>`<img class="${cls}" src="${src}" alt="${alt}" draggable="false">`;

function renderScene(scene){
 if(scene.id==='CUT03')return `<div class="shot image-shot cut03-shot" data-scene="${scene.id}">${img(scene.src,'scene-img cut03-img',scene.alt)}</div>`;
 if(scene.id!=='CUT02')return `<div class="shot image-shot" data-scene="${scene.id}">${img(scene.src,'scene-img',scene.alt)}</div>`;
 return `<div class="shot cut02-shot" data-scene="CUT02"><div class="cut02-visual"><img class="cut02-frame" id="cut02Frame" src="${FRAME.neutral||scene.src}" alt="${scene.alt}" draggable="false"><div class="cut02-fx glass"></div></div></div>`;
}

function loadImage(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}
async function buildExpressionFrames(){
  const b64=await fetch('./assets/cutscenes/cut02_expr/'+SPRITE_FILE+'?v='+V).then(r=>{if(!r.ok)throw new Error('CUT02 표정 스프라이트 로드 실패');return r.text()});
  const sprite=await loadImage('data:image/webp;base64,'+b64.trim());
  const frameW=1024,frameH=1536;
  for(let i=0;i<SPRITE_STATES.length;i++){
    const c=document.createElement('canvas');c.width=frameW;c.height=frameH;
    c.getContext('2d').drawImage(sprite,0,i*frameH,frameW,frameH,0,0,frameW,frameH);
    FRAME[SPRITE_STATES[i]]=c.toDataURL('image/webp',.88);
  }
  FRAME.talk2=FRAME.neutral;
}

function fatal(title,detail){
 window.__CUTSCENE_QA__.activeScene='ERROR';
 app.innerHTML=`<main class="fatal"><div><small>OPENING RESOURCE CHECK</small><h1>${title}</h1><p>${detail}</p><button onclick="location.reload()">다시 확인</button></div></main>`;
}

function preloadImage(src,id=''){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{if(i.naturalWidth<900||i.naturalHeight<1500)return reject(new Error(`${id||src} 해상도 부족: ${i.naturalWidth}×${i.naturalHeight}`));resolve({id:id||src,file:src,width:i.naturalWidth,height:i.naturalHeight,loaded:true})};i.onerror=()=>reject(new Error(`${id||src} 이미지 요청 실패`));i.src=src})}
function preload(scene){return preloadImage(scene.src,scene.id)}

function verify(scene){
 const start=performance.now();
 const run=()=>{
   if(window.__CUTSCENE_QA__.activeScene!==scene.id)return;
   const shot=document.querySelector(`[data-scene="${scene.id}"]`);
   const imgs=shot?[...shot.querySelectorAll('img')]:[];
   const visible=!!shot&&shot.classList.contains('active')&&parseFloat(getComputedStyle(shot).opacity)>.01;
   const ready=imgs.length>0&&imgs.every(i=>i.complete&&i.naturalWidth>=900);
   if(visible&&ready){if(scene.id==='CUT03')window.__CUTSCENE_QA__.cut03Rendered=true;return}
   if(performance.now()-start<1800)return setTimeout(()=>requestAnimationFrame(run),80);
   fatal(`${scene.id} 표시 검증 실패`,'이미지는 존재하지만 실제 장면이 제한 시간 안에 준비되지 않았습니다.');
 };
 requestAnimationFrame(run);
}

function start(){
 app.innerHTML=`<div class="stage" id="stage" data-env="rain">${scenes.map(renderScene).join('')}<div class="rain"></div><div class="grain"></div><div class="noise"></div><div class="scanline"></div><div class="flicker" id="flicker"></div><div class="warning"></div><div class="toplabel" id="toplabel"></div><button class="skip" id="skip">SKIP</button><div class="choices" id="choices"></div><div class="caption" id="caption"><div class="speaker" id="speaker"></div><div class="line" id="line" aria-live="polite"></div><div class="hint" id="hint">화면을 터치하여 진행</div></div><button class="tap" id="tap" aria-label="다음 대사 또는 장면"></button><div class="fade" id="fade"></div></div>`;

 const stage=document.querySelector('#stage'),shots=[...document.querySelectorAll('.shot')],caption=document.querySelector('#caption'),speaker=document.querySelector('#speaker'),line=document.querySelector('#line'),hint=document.querySelector('#hint'),choices=document.querySelector('#choices'),toplabel=document.querySelector('#toplabel'),fade=document.querySelector('#fade'),flicker=document.querySelector('#flicker');
 let si=0,queue=[],waitingChoice=false,locked=false,finished=false,hajinBeat=0;

 function applyCut02State(item){
   const cut02=document.querySelector('[data-scene="CUT02"]');
   const frame=document.querySelector('#cut02Frame');
   if(!cut02||!cut02.classList.contains('active')||!frame)return;
   cut02.className='shot cut02-shot active';
   if(item.speaker==='관리관'){
     frame.src=FRAME.sad||FRAME.neutral;
     cut02.classList.add('listening');
     return;
   }
   if(item.speaker!=='윤하진'){frame.src=FRAME.neutral;return;}
   let state=(hajinBeat%2===0?'talk1':'talk2');
   if(item.text.includes('관리관님?'))state='surprise';
   else if(item.text.includes('다친 사람')||item.text.includes('연락이 안 되는')||item.text.includes('부탁드릴게요')||item.text.includes('그대로 믿진 마세요'))state='sad';
   else if(item.text.includes('끊어주세요')||item.text.includes('저거부터 보죠'))state='determined';
   frame.src=FRAME[state]||FRAME.neutral;
   cut02.classList.add(['talk-a','talk-b','talk-c'][hajinBeat%3],`state-${state}`);
   if(state==='surprise'||state==='determined')cut02.classList.add('emphasis');
   hajinBeat++;
 }

 function setDialogue(item){
   const isPlayer=item.speaker==='관리관';
   applyCut02State(item);
   speaker.textContent=isPlayer?'관리관 · 당신':item.speaker;
   caption.classList.toggle('player-turn',isPlayer);
   caption.classList.toggle('hajin-turn',item.speaker==='윤하진');
   line.textContent=item.text;
   hint.textContent='화면을 터치하여 진행';
 }

 function renderChoice(event){
   waitingChoice=true;hint.textContent='대답을 선택하세요';choices.innerHTML='';
   event.options.forEach(opt=>{
     const b=document.createElement('button');b.className='choice';b.textContent=opt.label;
     b.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();if(!waitingChoice)return;waitingChoice=false;choices.classList.remove('show');setTimeout(()=>{choices.innerHTML='';queue=[...opt.lines,...(event.after||[]),...queue];advance()},90)});
     choices.appendChild(b);
   });
   choices.classList.add('show');
 }

 function advance(){
   if(finished||waitingChoice)return;
   if(!queue.length){
     if(si<scenes.length-1){fade.classList.add('on');setTimeout(()=>{si++;show(si);fade.classList.remove('on')},380)}
     else handoff();
     return;
   }
   const item=queue.shift();
   if(item.type==='choice')return renderChoice(item);
   setDialogue(item);
 }

 function show(index){
   const s=scenes[index];
   shots.forEach(x=>x.classList.toggle('active',x.dataset.scene===s.id));
   stage.dataset.env=s.env;toplabel.textContent=s.top;window.__CUTSCENE_QA__.activeScene=s.id;
   queue=[...s.script];waitingChoice=false;choices.classList.remove('show');choices.innerHTML='';
   flicker.classList.add('on');setTimeout(()=>flicker.classList.remove('on'),70);
   verify(s);advance();
 }

 function handoff(){
   if(finished)return;finished=true;window.__CUTSCENE_QA__.activeScene='HANDOFF';choices.classList.remove('show');fade.classList.add('on');setTimeout(()=>location.assign(MANAGEMENT_URL),440);
 }
 function next(){if(locked||finished||waitingChoice)return;locked=true;setTimeout(()=>locked=false,130);advance()}

 document.querySelector('#tap').addEventListener('pointerup',e=>{e.preventDefault();next()});
 document.querySelector('#skip').addEventListener('pointerup',e=>{e.preventDefault();handoff()});
 document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!waitingChoice){e.preventDefault();next()}});
 show(0);
}

Promise.all(scenes.map(preload)).then(async reports=>{window.__CUTSCENE_QA__.assets=reports;await buildExpressionFrames();start()}).catch(err=>fatal('컷씬 리소스를 확인할 수 없습니다.',err.message));
})();
</script>
