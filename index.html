<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050607">
<title>잔향국 · 동부 제6관리소</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#050607;color:#f0f0f0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;touch-action:manipulation}button{font:inherit}.preload,.fatal{width:100vw;height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;background:#050607}.preload-mark{width:22px;height:22px;border:1px solid #737981;border-right-color:transparent;border-radius:50%;animation:spin .9s linear infinite;margin:auto}.preload p{margin:14px 0 0;color:#92979e;font-size:12px;letter-spacing:.14em}@keyframes spin{to{transform:rotate(360deg)}}.fatal>div{max-width:340px}.fatal small{color:#7e858d;letter-spacing:.12em}.fatal h1{margin:14px 0 10px;font-size:21px}.fatal p{color:#aeb3b9;font-size:13px;line-height:1.65}.fatal button{min-width:140px;min-height:44px;margin-top:22px;border:1px solid #474d55;border-radius:10px;background:#111418;color:#eef0f2}.stage{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#000;isolation:isolate}.shot{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .62s ease}.shot.active{opacity:1}.scene-img,.cut02-img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% 50%;user-select:none;-webkit-user-drag:none}.image-shot.active{animation:cameraStill 8s ease-out both}@keyframes cameraStill{from{transform:scale(1)}to{transform:scale(1.025)}}
.cut02-frame{position:absolute;inset:0;overflow:hidden;transform-origin:48% 48%}.cut02-shot.active .cut02-frame{animation:cut02Camera 8.2s cubic-bezier(.2,.6,.2,1) both}.cut02-base{z-index:1}.cut02-motion{z-index:2;pointer-events:none;will-change:transform;opacity:.72;filter:brightness(1.012) contrast(1.005)}.motion-shoulder{clip-path:polygon(0 38%,23% 34%,44% 39%,52% 49%,45% 60%,0 67%);transform-origin:30% 52%;animation:shoulderMove 4.4s ease-in-out infinite}.motion-coat{clip-path:polygon(2% 47%,22% 40%,56% 43%,74% 55%,82% 100%,0 100%,0 62%);transform-origin:48% 77%;animation:coatMove 4.4s ease-in-out infinite}.motion-right-arm{clip-path:polygon(67% 45%,89% 45%,100% 53%,100% 79%,83% 78%,67% 65%);transform-origin:78% 50%;animation:rightArmMove 4.9s ease-in-out infinite}.motion-folder{clip-path:polygon(14% 66%,57% 62%,67% 88%,49% 100%,17% 100%,8% 83%);transform-origin:38% 74%;animation:folderMove 4.7s ease-in-out infinite}.motion-lower{clip-path:polygon(0 72%,37% 69%,55% 100%,0 100%);transform-origin:25% 83%;animation:lowerMove 5.1s ease-in-out infinite}@keyframes cut02Camera{0%{transform:scale(1) translate3d(0,0,0)}100%{transform:scale(1.018) translate3d(-2px,-4px,0)}}@keyframes shoulderMove{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(2px,-4px,0) rotate(.28deg)}}@keyframes coatMove{0%,100%{transform:translate3d(0,0,0) scaleY(1)}50%{transform:translate3d(2px,-6px,0) scaleY(1.008)}}@keyframes rightArmMove{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(4px,-3px,0) rotate(-.48deg)}}@keyframes folderMove{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(3px,-5px,0) rotate(-.62deg)}}@keyframes lowerMove{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-2px,-4px,0)}}
.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 0 54%,rgba(255,255,255,.015) 58%,transparent 62%);mix-blend-mode:screen;animation:glass 8s ease-in-out infinite;z-index:5}@keyframes glass{0%,75%,100%{opacity:.18;transform:translateX(-5%)}88%{opacity:.45;transform:translateX(5%)}}.rain,.grain,.noise,.scanline,.flicker{position:absolute;inset:0;pointer-events:none}.rain{opacity:0;background-image:repeating-linear-gradient(105deg,transparent 0 18px,rgba(255,255,255,.1) 19px,transparent 20px 38px);background-size:170px 170px;animation:rain 1.5s linear infinite;mix-blend-mode:screen;transition:opacity .4s}.stage[data-env=rain] .rain{opacity:.18}@keyframes rain{to{background-position:-80px 170px}}.grain{opacity:.04;background-image:radial-gradient(rgba(255,255,255,.26) .45px,transparent .6px);background-size:4px 4px;animation:grain .2s steps(2) infinite}@keyframes grain{50%{transform:translate(.8%,-.8%)}}.noise{opacity:0;background-image:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(255,255,255,.035) 4px);transition:opacity .4s}.stage[data-env=monitor] .noise{opacity:.16}.stage[data-env=cctv] .noise{opacity:.32}.scanline{opacity:0;background:linear-gradient(to bottom,transparent 0 38%,rgba(224,239,244,.09) 42%,transparent 46%);animation:scan 3.2s linear infinite}.stage[data-env=cctv] .scanline{opacity:.28}@keyframes scan{from{transform:translateY(-60%)}to{transform:translateY(80%)}}.flicker{background:rgba(255,255,255,0);transition:background .08s}.flicker.on{background:rgba(255,255,255,.07)}.warning{position:absolute;right:5vw;top:8vh;width:8px;height:8px;border-radius:50%;background:#941b1b;box-shadow:0 0 16px rgba(207,30,30,.72);opacity:.16;animation:warning 2.9s ease-in-out infinite;pointer-events:none}@keyframes warning{50%{opacity:.78}}.caption{position:absolute;left:0;right:0;bottom:0;min-height:25vh;padding:18px 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent,rgba(0,0,0,.7) 28%,rgba(0,0,0,.94));opacity:0;transform:translateY(8px);transition:opacity .26s,transform .26s;z-index:12;pointer-events:none}.caption.show{opacity:1;transform:none}.speaker{margin-bottom:8px;color:#d8dce0;font-size:13px;letter-spacing:.06em}.line{min-height:58px;color:#f3f4f5;font-size:20px;line-height:1.55;text-shadow:0 1px 9px #000}.hint{margin-top:8px;color:#8f959c;font-size:11px}.toplabel{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;z-index:12;color:rgba(255,255,255,.72);font-size:11px;letter-spacing:.14em;text-shadow:0 2px 8px #000;pointer-events:none}.skip{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;z-index:30;min-width:58px;min-height:44px;padding:10px 14px;border:1px solid rgba(255,255,255,.24);border-radius:18px;background:rgba(0,0,0,.52);color:#dedfe1;font-size:12px}.tap{position:absolute;inset:0;z-index:20;border:0;background:transparent;-webkit-tap-highlight-color:transparent}.fade{position:absolute;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .44s}.fade.on{opacity:1}@media(min-width:700px){.stage{max-width:430px;margin:auto}}@media(prefers-reduced-motion:reduce){.rain,.grain,.scanline,.warning,.glass{animation-duration:8s!important}}
</style>
</head>
<body>
<div id="app"><main class="preload"><div><div class="preload-mark"></div><p>관리소 연결 중</p></div></main></div>
<script>
(() => {
  const MANAGEMENT_URL='https://nocturne-protocol-mobile.quiet-earth-0178.chatgpt.site/';
  const V='20260921-motion2';
  const scenes=[
    {id:'CUT01',src:'./resources/cutscene_01_arrival.png?v='+V,top:'동부 제6관리소',speaker:'안내',dialogues:['동부 제6관리소.'],env:'rain',alt:'비가 내리는 동부 제6관리소 출입구'},
    {id:'CUT02',src:'./cut02_master.png?v='+V,top:'관리구역 · 내부',speaker:'윤하진',dialogues:['관리관님?','맞으시죠.','하진입니다.','지금 현장에 남아 있는 사람은 저 하나예요.'],env:'monitor',alt:'관리구역 내부에서 윤하진을 처음 만나는 장면'},
    {id:'CUT03',src:'./cutscene_03_first_echo.png?v='+V,top:'관리실 · 격실 01',speaker:'윤하진',dialogues:['저게 첫 번째예요.'],env:'cctv',alt:'관리실 CCTV로 첫 잔향 한 획을 확인하는 장면'}
  ];
  const app=document.querySelector('#app');
  window.__CUTSCENE_QA__={assets:[],activeScene:'PRELOAD',cut03Rendered:false,cut02MotionVersion:'motion2',badgeSeparateLayer:false,faceDeformation:false};
  const img=(src,cls,alt='')=>`<img class="${cls}" src="${src}" alt="${alt}" draggable="false">`;
  function renderScene(scene){
    if(scene.id!=='CUT02')return `<div class="shot image-shot" data-scene="${scene.id}">${img(scene.src,'scene-img',scene.alt)}</div>`;
    const s=scene.src;
    return `<div class="shot cut02-shot" data-scene="CUT02"><div class="cut02-frame">${img(s,'cut02-img cut02-base',scene.alt)}${img(s,'cut02-img cut02-motion motion-shoulder','')}${img(s,'cut02-img cut02-motion motion-coat','')}${img(s,'cut02-img cut02-motion motion-right-arm','')}${img(s,'cut02-img cut02-motion motion-folder','')}${img(s,'cut02-img cut02-motion motion-lower','')}<div class="glass"></div></div></div>`;
  }
  function fatal(title,detail){window.__CUTSCENE_QA__.activeScene='ERROR';app.innerHTML=`<main class="fatal"><div><small>OPENING RESOURCE CHECK</small><h1>${title}</h1><p>${detail}</p><button onclick="location.reload()">다시 확인</button></div></main>`}
  function preload(scene){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{if(i.naturalWidth<900||i.naturalHeight<1500)return reject(new Error(`${scene.id} 해상도 부족: ${i.naturalWidth}×${i.naturalHeight}`));resolve({id:scene.id,file:scene.src,width:i.naturalWidth,height:i.naturalHeight,loaded:true})};i.onerror=()=>reject(new Error(`${scene.id} 이미지 요청 실패`));i.src=scene.src})}
  function verify(scene){const start=performance.now();const run=()=>{if(window.__CUTSCENE_QA__.activeScene!==scene.id)return;const shot=document.querySelector(`[data-scene="${scene.id}"]`);const first=shot?.querySelector('img');const visible=!!shot&&shot.classList.contains('active')&&parseFloat(getComputedStyle(shot).opacity)>.01;const primary=!!first&&first.complete&&first.naturalWidth>=900;if(visible&&primary){if(scene.id==='CUT03')window.__CUTSCENE_QA__.cut03Rendered=true;return}if(performance.now()-start<1800)return setTimeout(()=>requestAnimationFrame(run),80);fatal(`${scene.id} 표시 검증 실패`,'이미지는 존재하지만 실제 장면이 제한 시간 안에 준비되지 않았습니다.')};requestAnimationFrame(run)}
  function start(){
    app.innerHTML=`<div class="stage" id="stage" data-env="rain">${scenes.map(renderScene).join('')}<div class="rain"></div><div class="grain"></div><div class="noise"></div><div class="scanline"></div><div class="flicker" id="flicker"></div><div class="warning"></div><div class="toplabel" id="toplabel"></div><button class="skip" id="skip">SKIP</button><div class="caption show" id="caption"><div class="speaker" id="speaker"></div><div class="line" id="line" aria-live="polite"></div><div class="hint">화면을 터치하여 진행</div></div><button class="tap" id="tap" aria-label="다음 대사 또는 장면"></button><div class="fade" id="fade"></div></div>`;
    const stage=document.querySelector('#stage'),shots=[...document.querySelectorAll('.shot')],caption=document.querySelector('#caption'),speaker=document.querySelector('#speaker'),line=document.querySelector('#line'),toplabel=document.querySelector('#toplabel'),fade=document.querySelector('#fade'),flicker=document.querySelector('#flicker');let si=0,di=0,locked=false,finished=false;
    function setDialogue(text){caption.classList.remove('show');setTimeout(()=>{if(!document.body.contains(caption))return;line.textContent=text;caption.classList.add('show')},90)}
    function show(index){const s=scenes[index];shots.forEach(x=>x.classList.toggle('active',x.dataset.scene===s.id));stage.dataset.env=s.env;toplabel.textContent=s.top;speaker.textContent=s.speaker;di=0;window.__CUTSCENE_QA__.activeScene=s.id;setDialogue(s.dialogues[0]);flicker.classList.add('on');setTimeout(()=>flicker.classList.remove('on'),90);verify(s)}
    function handoff(){if(finished)return;finished=true;window.__CUTSCENE_QA__.activeScene='HANDOFF';fade.classList.add('on');setTimeout(()=>location.assign(MANAGEMENT_URL),480)}
    function next(){if(locked||finished)return;locked=true;setTimeout(()=>locked=false,180);const s=scenes[si];if(di<s.dialogues.length-1){di++;setDialogue(s.dialogues[di]);return}if(si<scenes.length-1){fade.classList.add('on');setTimeout(()=>{si++;show(si);fade.classList.remove('on')},420);return}handoff()}
    document.querySelector('#tap').addEventListener('pointerup',e=>{e.preventDefault();next()});document.querySelector('#skip').addEventListener('pointerup',e=>{e.preventDefault();handoff()});document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}});show(0)
  }
  Promise.all(scenes.map(preload)).then(reports=>{window.__CUTSCENE_QA__.assets=reports;start()}).catch(err=>fatal('컷씬 리소스를 확인할 수 없습니다.',err.message));
})();
</script>
</body>
</html>
