<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050607">
<title>잔향국 · 동부 제6관리소</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#f2f2f2;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;touch-action:manipulation}button{font:inherit}.preload,.fatal{width:100vw;height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;background:#050607}.preload-mark{width:22px;height:22px;border:1px solid #737981;border-right-color:transparent;border-radius:50%;animation:spin .9s linear infinite;margin:auto}.preload p{margin-top:14px;color:#92979e;font-size:12px;letter-spacing:.14em}@keyframes spin{to{transform:rotate(360deg)}}.fatal h1{font-size:19px}.fatal p{color:#adb2b8;font-size:13px;line-height:1.6}.fatal button{min-height:44px;padding:9px 18px;border:1px solid #454b52;border-radius:12px;background:#121519;color:#eee}.stage{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#000;isolation:isolate}.shot{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .55s ease}.shot.active{opacity:1}.scene-img,.cut02-master,.cut02-motion{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% 50%;user-select:none;-webkit-user-drag:none;pointer-events:none}.image-shot.active{animation:stillPush 8s ease-out both}@keyframes stillPush{from{transform:scale(1)}to{transform:scale(1.025)}}
/* CUT02: master가 윤하진 정본. 얼굴/안경/눈/입은 한 픽셀도 별도 transform하지 않는다. */
.cut02-frame{position:absolute;inset:0;overflow:hidden}.cut02-master{z-index:2;transform:none!important;animation:none!important}.cut02-motion{z-index:3;will-change:transform;backface-visibility:hidden}.cut02-torso{opacity:.14;clip-path:polygon(0 40%,100% 39%,100% 100%,0 100%);transform-origin:50% 72%;animation:torsoBreath 4s ease-in-out infinite}.cut02-arms{opacity:.16;clip-path:polygon(0 49%,28% 48%,52% 64%,62% 47%,100% 46%,100% 100%,0 100%);transform-origin:56% 69%;animation:armWeight 4.6s ease-in-out infinite}.cut02-hair{opacity:.22;clip-path:polygon(4% 4%,95% 4%,94% 42%,75% 43%,68% 33%,62% 24%,40% 13%,21% 19%,5% 31%);transform-origin:48% 27%;animation:hairDrift 3.5s ease-in-out infinite}.cut02-badge{z-index:5;opacity:.72;transform-origin:67% 66%;animation:badgeSwing 2.5s ease-in-out infinite}.cut02-folder{z-index:4;opacity:.23;clip-path:polygon(0 57%,70% 57%,74% 100%,0 100%);transform-origin:33% 82%;animation:folderLag 4.3s ease-in-out infinite}.cut02-face-guard{position:absolute;z-index:6;left:27%;top:15%;width:43%;height:33%;pointer-events:none;background:transparent}.cut02-shot.active .cut02-master{transform:none!important}@keyframes torsoBreath{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(1px,-4px,0) scale(1.006)}}@keyframes armWeight{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(3px,-5px,0) rotate(.65deg)}}@keyframes hairDrift{0%,100%{transform:translate3d(-1px,0,0) rotate(-.35deg)}50%{transform:translate3d(3px,2px,0) rotate(.7deg)}}@keyframes badgeSwing{0%,100%{transform:scale(.19) translate3d(-3px,1px,0) rotate(-4deg)}25%{transform:scale(.19) translate3d(7px,8px,0) rotate(4.5deg)}50%{transform:scale(.19) translate3d(10px,12px,0) rotate(6deg)}75%{transform:scale(.19) translate3d(3px,5px,0) rotate(1deg)}}@keyframes folderLag{0%,100%{transform:translate3d(0,0,0) rotate(-.2deg)}50%{transform:translate3d(4px,-3px,0) rotate(1.05deg)}}
.glass{position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(105deg,transparent 0 54%,rgba(255,255,255,.018) 58%,transparent 62%);mix-blend-mode:screen;animation:glass 8s ease-in-out infinite}@keyframes glass{0%,75%,100%{opacity:.15;transform:translateX(-5%)}88%{opacity:.4;transform:translateX(5%)}}.rain,.grain,.noise,.scanline,.flicker{position:absolute;inset:0;pointer-events:none}.rain{opacity:0;background-image:repeating-linear-gradient(105deg,transparent 0 18px,rgba(255,255,255,.1) 19px,transparent 20px 38px);background-size:170px 170px;animation:rain 1.5s linear infinite;mix-blend-mode:screen}.stage[data-env=rain] .rain{opacity:.18}@keyframes rain{to{background-position:-80px 170px}}.grain{opacity:.035;background-image:radial-gradient(rgba(255,255,255,.25) .45px,transparent .6px);background-size:4px 4px;animation:grain .2s steps(2) infinite}@keyframes grain{50%{transform:translate(.8%,-.8%)}}.noise{opacity:0;background-image:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(255,255,255,.035) 4px)}.stage[data-env=monitor] .noise{opacity:.13}.stage[data-env=cctv] .noise{opacity:.29}.scanline{opacity:0;background:linear-gradient(to bottom,transparent 0 38%,rgba(224,239,244,.09) 42%,transparent 46%);animation:scan 3.2s linear infinite}.stage[data-env=cctv] .scanline{opacity:.27}@keyframes scan{from{transform:translateY(-60%)}to{transform:translateY(80%)}}.flicker{background:rgba(255,255,255,0);transition:background .08s}.flicker.on{background:rgba(255,255,255,.065)}.warning{position:absolute;right:5vw;top:8vh;width:8px;height:8px;border-radius:50%;background:#941b1b;box-shadow:0 0 16px rgba(207,30,30,.72);opacity:.18;animation:warning 2.9s ease-in-out infinite;pointer-events:none}@keyframes warning{50%{opacity:.82}}.caption{position:absolute;left:0;right:0;bottom:0;min-height:24vh;padding:18px 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent,rgba(0,0,0,.7) 28%,rgba(0,0,0,.94));opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;z-index:12;pointer-events:none}.caption.show{opacity:1;transform:none}.speaker{margin-bottom:8px;color:#d8dce0;font-size:13px;letter-spacing:.06em}.line{min-height:58px;color:#f3f4f5;font-size:20px;line-height:1.55;text-shadow:0 1px 9px #000}.hint{margin-top:8px;color:#8f959c;font-size:11px}.toplabel{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;z-index:12;color:rgba(255,255,255,.72);font-size:11px;letter-spacing:.14em;text-shadow:0 2px 8px #000;pointer-events:none}.skip{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;z-index:30;min-width:58px;min-height:44px;padding:10px 14px;border:1px solid rgba(255,255,255,.24);border-radius:18px;background:rgba(0,0,0,.52);color:#dedfe1;font-size:12px}.tap{position:absolute;inset:0;z-index:20;border:0;background:transparent;-webkit-tap-highlight-color:transparent}.fade{position:absolute;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}.fade.on{opacity:1}@media(min-width:700px){.stage{max-width:430px;margin:auto}}@media(prefers-reduced-motion:reduce){.cut02-motion,.rain,.grain,.scanline,.warning,.glass{animation-duration:10s!important}}
</style>
</head>
<body>
<div id="app"><main class="preload"><div><div class="preload-mark"></div><p>관리소 연결 중</p></div></main></div>
<script>
(()=>{
const MANAGEMENT_URL='https://nocturne-protocol-mobile.quiet-earth-0178.chatgpt.site/';
const CUT02=[
'./cut02_master.png','./cut02_torso.png','./cut02_arms.png','./cut02_hair_loose.png','./cut02_badge.png','./cut02_folder.png'
];
const scenes=[
{id:'CUT01',src:'./resources/cutscene_01_arrival.png',top:'동부 제6관리소',speaker:'안내',dialogues:['동부 제6관리소.'],env:'rain',alt:'비가 내리는 동부 제6관리소 출입구'},
{id:'CUT02',top:'관리구역 · 내부',speaker:'윤하진',dialogues:['관리관님?','맞으시죠.','하진입니다.','지금 현장에 남아 있는 사람은 저 하나예요.'],env:'monitor',alt:'관리구역 내부에서 윤하진을 처음 만나는 장면'},
{id:'CUT03',src:'./cutscene_03_first_echo.png',top:'관리실 · 격실 01',speaker:'윤하진',dialogues:['저게 첫 번째예요.'],env:'cctv',alt:'관리실 CCTV로 첫 잔향 한 획을 확인하는 장면'}
];
const app=document.querySelector('#app');
window.__CUTSCENE_QA__={assets:[],activeScene:'PRELOAD',cut03Rendered:false,livePortraitActive:false,liveLayerCount:0,faceDeformation:false,faceLocked:true,cut02Mode:'separated-assets'};
const image=(src,cls,alt='')=>`<img class="${cls}" src="${src}" alt="${alt}" draggable="false">`;
function render(scene){
 if(scene.id==='CUT02')return `<div class="shot cut02-shot" data-scene="CUT02"><div class="cut02-frame">${image('./cut02_master.png','cut02-master',scene.alt)}${image('./cut02_torso.png','cut02-motion cut02-torso')}${image('./cut02_arms.png','cut02-motion cut02-arms')}${image('./cut02_hair_loose.png','cut02-motion cut02-hair')}${image('./cut02_badge.png','cut02-motion cut02-badge')}${image('./cut02_folder.png','cut02-motion cut02-folder')}<div class="cut02-face-guard"></div><div class="glass"></div></div></div>`;
 return `<div class="shot image-shot" data-scene="${scene.id}">${image(scene.src,'scene-img',scene.alt)}</div>`;
}
function fatal(title,detail){window.__CUTSCENE_QA__.activeScene='ERROR';app.innerHTML=`<main class="fatal"><div><h1>${title}</h1><p>${detail}</p><button onclick="location.reload()">다시 확인</button></div></main>`}
function preloadOne(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve({src,width:i.naturalWidth,height:i.naturalHeight});i.onerror=()=>reject(new Error(src+' 로드 실패'));i.src=src})}
async function preloadAll(){const files=['./resources/cutscene_01_arrival.png',...CUT02,'./cutscene_03_first_echo.png'];const result=await Promise.all(files.map(preloadOne));for(const r of result){if(r.width<900||r.height<1400)throw new Error(`${r.src} 해상도 부족: ${r.width}×${r.height}`)}return result}
function verify(id){const start=performance.now();const loop=()=>{if(window.__CUTSCENE_QA__.activeScene!==id)return;const shot=document.querySelector(`[data-scene="${id}"]`);const imgs=[...(shot?.querySelectorAll('img')||[])];const ready=shot?.classList.contains('active')&&imgs.length&&imgs.every(i=>i.complete&&i.naturalWidth>=900);if(ready){if(id==='CUT02'){window.__CUTSCENE_QA__.livePortraitActive=true;window.__CUTSCENE_QA__.liveLayerCount=6;window.__CUTSCENE_QA__.faceLocked=true}if(id==='CUT03')window.__CUTSCENE_QA__.cut03Rendered=true;return}if(performance.now()-start<2200)return setTimeout(()=>requestAnimationFrame(loop),80);fatal(id+' 표시 검증 실패','컷씬 리소스가 제한 시간 안에 준비되지 않았습니다.')};requestAnimationFrame(loop)}
function start(){app.innerHTML=`<div class="stage" id="stage" data-env="rain">${scenes.map(render).join('')}<div class="rain"></div><div class="grain"></div><div class="noise"></div><div class="scanline"></div><div class="flicker" id="flicker"></div><div class="warning"></div><div class="toplabel" id="toplabel"></div><button class="skip" id="skip">SKIP</button><div class="caption show" id="caption"><div class="speaker" id="speaker"></div><div class="line" id="line" aria-live="polite"></div><div class="hint">화면을 터치하여 진행</div></div><button class="tap" id="tap" aria-label="다음"></button><div class="fade" id="fade"></div></div>`;
 const stage=document.querySelector('#stage'),shots=[...document.querySelectorAll('.shot')],caption=document.querySelector('#caption'),speaker=document.querySelector('#speaker'),line=document.querySelector('#line'),toplabel=document.querySelector('#toplabel'),fade=document.querySelector('#fade'),flicker=document.querySelector('#flicker');let si=0,di=0,lock=false,done=false;
 const setLine=t=>{caption.classList.remove('show');setTimeout(()=>{line.textContent=t;caption.classList.add('show')},80)};
 const show=n=>{const s=scenes[n];shots.forEach(x=>x.classList.toggle('active',x.dataset.scene===s.id));stage.dataset.env=s.env;toplabel.textContent=s.top;speaker.textContent=s.speaker;di=0;window.__CUTSCENE_QA__.activeScene=s.id;setLine(s.dialogues[0]);flicker.classList.add('on');setTimeout(()=>flicker.classList.remove('on'),80);verify(s.id)};
 const handoff=()=>{if(done)return;done=true;window.__CUTSCENE_QA__.activeScene='HANDOFF';fade.classList.add('on');setTimeout(()=>location.assign(MANAGEMENT_URL),450)};
 const next=()=>{if(lock||done)return;lock=true;setTimeout(()=>lock=false,170);const s=scenes[si];if(di<s.dialogues.length-1){di++;setLine(s.dialogues[di]);return}if(si<scenes.length-1){fade.classList.add('on');setTimeout(()=>{si++;show(si);fade.classList.remove('on')},390);return}handoff()};
 document.querySelector('#tap').addEventListener('pointerup',e=>{e.preventDefault();next()});document.querySelector('#skip').addEventListener('pointerup',e=>{e.preventDefault();handoff()});document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}});show(0)
}
preloadAll().then(r=>{window.__CUTSCENE_QA__.assets=r;start()}).catch(e=>fatal('컷씬 리소스를 확인할 수 없습니다.',e.message));
})();
</script>
</body>
</html>
