<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050607">
<title>잔향국 · 동부 제6관리소</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#050607;color:#f0f0f0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;touch-action:manipulation}button{font:inherit}.preload,.fatal{width:100vw;height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;background:#050607}.preload-mark{width:22px;height:22px;border:1px solid #737981;border-right-color:transparent;border-radius:50%;animation:spin .9s linear infinite;margin:auto}.preload p{margin:14px 0 0;color:#92979e;font-size:12px;letter-spacing:.14em}@keyframes spin{to{transform:rotate(360deg)}}.fatal>div{max-width:340px}.fatal small{color:#7e858d;letter-spacing:.12em}.fatal h1{margin:14px 0 10px;font-size:21px}.fatal p{color:#aeb3b9;font-size:13px;line-height:1.65}.fatal button{min-width:140px;min-height:44px;margin-top:22px;border:1px solid #474d55;border-radius:10px;background:#111418;color:#eef0f2}.stage{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#000;isolation:isolate}.shot{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .55s ease}.shot.active{opacity:1}.scene-img,.cut02-img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% 50%;user-select:none;-webkit-user-drag:none}.image-shot.active{animation:cameraStill 9s ease-out both}@keyframes cameraStill{from{transform:scale(1)}to{transform:scale(1.018)}}
.cut02-frame{position:absolute;inset:0;overflow:hidden;transform-origin:48% 48%}.cut02-shot.active .cut02-frame{animation:cut02Camera 9s cubic-bezier(.2,.6,.2,1) both}.cut02-base{z-index:1}.cut02-motion{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;pointer-events:none;will-change:transform;opacity:.56;filter:brightness(1.006) contrast(1.003)}.motion-head{z-index:4;clip-path:ellipse(29% 29% at 48% 27%);transform-origin:48% 31%;animation:headMove 6s ease-in-out infinite}.motion-shoulder{z-index:3;clip-path:polygon(0 38%,23% 34%,44% 39%,52% 49%,45% 60%,0 67%);transform-origin:30% 52%;animation:shoulderMove 6s ease-in-out infinite}.motion-coat{z-index:2;clip-path:polygon(2% 47%,22% 40%,56% 43%,74% 55%,82% 100%,0 100%,0 62%);transform-origin:48% 77%;animation:coatMove 6s ease-in-out infinite}.motion-right-arm{z-index:3;clip-path:polygon(67% 45%,89% 45%,100% 53%,100% 79%,83% 78%,67% 65%);transform-origin:78% 50%;animation:rightArmMove 6.15s ease-in-out infinite}.motion-folder{z-index:3;clip-path:polygon(14% 66%,57% 62%,67% 88%,49% 100%,17% 100%,8% 83%);transform-origin:38% 74%;animation:folderMove 6.25s ease-in-out infinite}.motion-lower{z-index:2;clip-path:polygon(0 72%,37% 69%,55% 100%,0 100%);transform-origin:25% 83%;animation:lowerMove 6.4s ease-in-out infinite}@keyframes cut02Camera{0%{transform:scale(1) translate3d(0,0,0)}100%{transform:scale(1.012) translate3d(-1px,-2px,0)}}@keyframes headMove{0%,100%{transform:translate3d(0,0,0) rotate(0)}42%{transform:translate3d(.12px,-.34px,0) rotate(-.04deg)}58%{transform:translate3d(.18px,-.46px,0) rotate(-.055deg)}}@keyframes shoulderMove{0%,100%{transform:translate3d(0,0,0) rotate(0)}42%{transform:translate3d(.35px,-.9px,0) rotate(.05deg)}58%{transform:translate3d(.5px,-1.25px,0) rotate(.07deg)}}@keyframes coatMove{0%,100%{transform:translate3d(0,0,0) scaleY(1)}42%{transform:translate3d(.35px,-1.15px,0) scaleY(1.0013)}58%{transform:translate3d(.55px,-1.65px,0) scaleY(1.002)}}@keyframes rightArmMove{0%,100%{transform:translate3d(0,0,0) rotate(0)}45%{transform:translate3d(.5px,-.55px,0) rotate(-.07deg)}60%{transform:translate3d(.8px,-.85px,0) rotate(-.11deg)}}@keyframes folderMove{0%,100%{transform:translate3d(0,0,0) rotate(0)}47%{transform:translate3d(.45px,-.65px,0) rotate(-.09deg)}62%{transform:translate3d(.7px,-1px,0) rotate(-.14deg)}}@keyframes lowerMove{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-.35px,-.8px,0)}}
.cut03-shot.active{animation:none}.cut03-img{object-position:50% 50%;transform:scale(1.008);transform-origin:55% 43%;will-change:transform}.cut03-shot.active .cut03-img{animation:cut03Focus 9s cubic-bezier(.2,.6,.2,1) both}@keyframes cut03Focus{0%{transform:scale(1.008) translate3d(0,0,0)}100%{transform:scale(1.03) translate3d(-.2%,-.12%,0)}}
.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 0 54%,rgba(255,255,255,.015) 58%,transparent 62%);mix-blend-mode:screen;animation:glass 8s ease-in-out infinite;z-index:5}@keyframes glass{0%,75%,100%{opacity:.18;transform:translateX(-5%)}88%{opacity:.4;transform:translateX(5%)}}.rain,.grain,.noise,.scanline,.flicker{position:absolute;inset:0;pointer-events:none}.rain{opacity:0;background-image:repeating-linear-gradient(105deg,transparent 0 18px,rgba(255,255,255,.1) 19px,transparent 20px 38px);background-size:170px 170px;animation:rain 1.5s linear infinite;mix-blend-mode:screen;transition:opacity .4s}.stage[data-env=rain] .rain{opacity:.18}@keyframes rain{to{background-position:-80px 170px}}.grain{opacity:.04;background-image:radial-gradient(rgba(255,255,255,.26) .45px,transparent .6px);background-size:4px 4px;animation:grain .2s steps(2) infinite}@keyframes grain{50%{transform:translate(.8%,-.8%)}}.noise{opacity:0;background-image:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(255,255,255,.035) 4px);transition:opacity .4s}.stage[data-env=monitor] .noise{opacity:.16}.stage[data-env=cctv] .noise{opacity:.32}.scanline{opacity:0;background:linear-gradient(to bottom,transparent 0 38%,rgba(224,239,244,.09) 42%,transparent 46%);animation:scan 3.2s linear infinite}.stage[data-env=cctv] .scanline{opacity:.30}@keyframes scan{from{transform:translateY(-60%)}to{transform:translateY(80%)}}.flicker{background:rgba(255,255,255,0);transition:background .08s}.flicker.on{background:rgba(255,255,255,.07)}.warning{position:absolute;right:5vw;top:8vh;width:8px;height:8px;border-radius:50%;background:#941b1b;box-shadow:0 0 16px rgba(207,30,30,.72);opacity:.16;animation:warning 2.9s ease-in-out infinite;pointer-events:none}@keyframes warning{50%{opacity:.78}}.caption{position:absolute;left:0;right:0;bottom:0;min-height:25vh;padding:18px 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent,rgba(0,0,0,.7) 28%,rgba(0,0,0,.94));opacity:0;transform:translateY(8px);transition:opacity .22s,transform .22s;z-index:12;pointer-events:none}.caption.show{opacity:1;transform:none}.speaker{margin-bottom:8px;color:#d8dce0;font-size:13px;letter-spacing:.06em}.speaker.player{color:#aebbc7}.line{min-height:62px;color:#f3f4f5;font-size:19px;line-height:1.55;text-shadow:0 1px 9px #000;word-break:keep-all}.hint{margin-top:8px;color:#8f959c;font-size:11px}.toplabel{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;z-index:12;color:rgba(255,255,255,.72);font-size:11px;letter-spacing:.14em;text-shadow:0 2px 8px #000;pointer-events:none}.skip{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;z-index:30;min-width:58px;min-height:44px;padding:10px 14px;border:1px solid rgba(255,255,255,.24);border-radius:18px;background:rgba(0,0,0,.52);color:#dedfe1;font-size:12px}.tap{position:absolute;inset:0;z-index:20;border:0;background:transparent;-webkit-tap-highlight-color:transparent}.choices{position:absolute;left:16px;right:16px;bottom:max(180px,25vh);z-index:35;display:flex;flex-direction:column;gap:9px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.choices.show{opacity:1;transform:none;pointer-events:auto}.choice{min-height:50px;padding:12px 14px;border:1px solid rgba(255,255,255,.25);border-radius:10px;background:rgba(7,9,11,.88);color:#eef1f3;text-align:left;font-size:14px;line-height:1.4;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.choice:active{background:rgba(35,39,43,.94);transform:scale(.995)}.fade{position:absolute;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .42s}.fade.on{opacity:1}@media(min-width:700px){.stage{max-width:430px;margin:auto}}@media(prefers-reduced-motion:reduce){.rain,.grain,.scanline,.warning,.glass,.cut02-motion{animation-duration:8s!important}}
</style>
</head>
<body>
<div id="app"><main class="preload"><div><div class="preload-mark"></div><p>관리소 연결 중</p></div></main></div>
<script>
(() => {
  const MANAGEMENT_URL='https://nocturne-protocol-mobile.quiet-earth-0178.chatgpt.site/';
  const V='20260921-briefing1';
  const L=(speaker,text)=>({type:'line',speaker,text});
  const scenes=[
    {id:'CUT01',src:'./resources/cutscene_01_arrival.png?v='+V,top:'동부 제6관리소',env:'rain',alt:'비가 내리는 동부 제6관리소 출입구',script:[L('안내','동부 제6관리소.')]},
    {id:'CUT02',src:'./cut02_master.png?v='+V,top:'관리구역 · 내부',env:'monitor',alt:'관리구역 내부에서 윤하진을 처음 만나는 장면',script:[
      L('윤하진','……관리관님?'),
      L('윤하진','맞죠. 윤하진입니다.'),
      L('윤하진','오셔서 다행입니다.'),
      L('윤하진','먼저 부탁드릴 게 있어요.'),
      L('윤하진','제가 격실에 들어가면, 밖에서 계속 보고 계셔 주세요.'),
      L('윤하진','누굴 들여보낼지, 어떤 작업을 시킬지 정하는 것도 관리관님 몫이고요.'),
      L('윤하진','반응이 이상하면 바로 중단해주세요.'),
      L('윤하진','제가 괜찮다고 해도요.'),
      {type:'choice',options:[
        {label:'지금 무슨 일이 있었던 겁니까?',lines:[L('관리관','지금 무슨 일이 있었던 겁니까?'),L('윤하진','사흘 전부터 격실 쪽 사고가 연달아 났습니다.'),L('윤하진','다친 사람은 빠졌고, 아직 연락이 안 되는 사람도 있어요.')]},
        {label:'다른 사람들은 어디 있습니까?',lines:[L('관리관','다른 사람들은 어디 있습니까?'),L('윤하진','빠졌습니다. 다친 사람도 있고, 먼저 철수한 사람도 있고요.'),L('윤하진','아직 연락이 안 되는 사람도 있습니다.')]}
      ],after:[
        L('윤하진','지금 현장에서 격실에 들어갈 수 있는 사람은 저 하나예요.'),
        L('윤하진','그래서 관리관님이 필요합니다.'),
        L('윤하진','안에 들어가 있으면, 이상한 걸 스스로 못 알아챌 때가 있어요.'),
        L('윤하진','그럴 땐 제가 더 보겠다고 해도 끊어주세요.'),
        L('윤하진','작업 하나 실패하는 게 사람 하나 잃는 것보다 낫습니다.'),
        L('관리관','중간에 멈춰도 되는 겁니까?'),
        L('윤하진','네. 애매하면 멈추세요.'),
        L('윤하진','상태가 안 좋으면 다음 작업도 넣지 말고, 격실 닫고 기록부터 봐주세요.'),
        L('윤하진','밖에서 관리관님이 보고 계신다는 전제로 들어가는 겁니다.'),
        L('윤하진','그게 아니면…… 저도 굳이 들어가고 싶진 않아서.'),
        L('윤하진','설명만 들어선 감 안 오실 겁니다.'),
        L('윤하진','저거부터 보죠.')
      ]}
    ]},
    {id:'CUT03',src:'./cutscene_03_first_echo.png?v='+V,top:'관리실 · 격실 01',env:'cctv',alt:'윤하진이 격실 01의 첫 잔향 한 획을 바라보는 장면',script:[
      L('윤하진','격실 01.'),
      L('윤하진','식별명은 ‘한 획’.'),
      L('윤하진','남은 기록은 몇 건 있는데, 그대로 믿진 마세요.'),
      {type:'choice',options:[
        {label:'뭘 보고 중단하면 됩니까?',lines:[L('관리관','뭘 보고 중단하면 됩니까?'),L('윤하진','제 상태부터 보세요.'),L('윤하진','말이 늦어지거나, 행동이 평소랑 다르면 끊으세요.'),L('윤하진','격실 쪽 변화가 먼저 오면 더 빨리요.')]},
        {label:'제가 뭘 결정해야 합니까?',lines:[L('관리관','제가 뭘 결정해야 합니까?'),L('윤하진','작업을 고르고, 계속할지 끊을지 정해주세요.'),L('윤하진','제가 안에서 더 하겠다고 해도, 밖에서 위험해 보이면 끝내시고요.')]}
      ],after:[
        L('윤하진','애매하면 그냥 끊으세요.'),
        L('윤하진','살아남은 사람들은 대체로 그렇게 합니다.'),
        L('관리관','그리고 나면요?'),
        L('윤하진','결과를 기록하고, 다음엔 조금 덜 모른 채 들어가는 겁니다.'),
        L('윤하진','그게 여기서 하는 일입니다.'),
        L('윤하진','준비되셨으면…… 시작하죠.')
      ]}
    ]}
  ];
  const app=document.querySelector('#app');
  window.__CUTSCENE_QA__={assets:[],activeScene:'PRELOAD',cut03Rendered:false,interactiveBriefing:true,badgeSeparateLayer:false,faceDeformation:false};
  const img=(src,cls,alt='')=>`<img class="${cls}" src="${src}" alt="${alt}" draggable="false">`;
  function renderScene(scene){
    if(scene.id==='CUT03')return `<div class="shot image-shot cut03-shot" data-scene="${scene.id}">${img(scene.src,'scene-img cut03-img',scene.alt)}</div>`;
    if(scene.id!=='CUT02')return `<div class="shot image-shot" data-scene="${scene.id}">${img(scene.src,'scene-img',scene.alt)}</div>`;
    const s=scene.src;
    return `<div class="shot cut02-shot" data-scene="CUT02"><div class="cut02-frame">${img(s,'cut02-img cut02-base',scene.alt)}${img(s,'cut02-motion motion-head','')}${img(s,'cut02-motion motion-shoulder','')}${img(s,'cut02-motion motion-coat','')}${img(s,'cut02-motion motion-right-arm','')}${img(s,'cut02-motion motion-folder','')}${img(s,'cut02-motion motion-lower','')}<div class="glass"></div></div></div>`;
  }
  function fatal(title,detail){window.__CUTSCENE_QA__.activeScene='ERROR';app.innerHTML=`<main class="fatal"><div><small>OPENING RESOURCE CHECK</small><h1>${title}</h1><p>${detail}</p><button onclick="location.reload()">다시 확인</button></div></main>`}
  function preload(scene){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{if(i.naturalWidth<900||i.naturalHeight<1500)return reject(new Error(`${scene.id} 해상도 부족: ${i.naturalWidth}×${i.naturalHeight}`));resolve({id:scene.id,file:scene.src,width:i.naturalWidth,height:i.naturalHeight,loaded:true})};i.onerror=()=>reject(new Error(`${scene.id} 이미지 요청 실패`));i.src=scene.src})}
  function verify(scene){const start=performance.now();const run=()=>{if(window.__CUTSCENE_QA__.activeScene!==scene.id)return;const shot=document.querySelector(`[data-scene="${scene.id}"]`);const first=shot?.querySelector('img');const visible=!!shot&&shot.classList.contains('active')&&parseFloat(getComputedStyle(shot).opacity)>.01;const primary=!!first&&first.complete&&first.naturalWidth>=900;if(visible&&primary){if(scene.id==='CUT03')window.__CUTSCENE_QA__.cut03Rendered=true;return}if(performance.now()-start<1800)return setTimeout(()=>requestAnimationFrame(run),80);fatal(`${scene.id} 표시 검증 실패`,'이미지는 존재하지만 실제 장면이 제한 시간 안에 준비되지 않았습니다.')};requestAnimationFrame(run)}
  function start(){
    app.innerHTML=`<div class="stage" id="stage" data-env="rain">${scenes.map(renderScene).join('')}<div class="rain"></div><div class="grain"></div><div class="noise"></div><div class="scanline"></div><div class="flicker" id="flicker"></div><div class="warning"></div><div class="toplabel" id="toplabel"></div><button class="skip" id="skip">SKIP</button><div class="choices" id="choices"></div><div class="caption show" id="caption"><div class="speaker" id="speaker"></div><div class="line" id="line" aria-live="polite"></div><div class="hint" id="hint">화면을 터치하여 진행</div></div><button class="tap" id="tap" aria-label="다음 대사 또는 장면"></button><div class="fade" id="fade"></div></div>`;
    const stage=document.querySelector('#stage'),shots=[...document.querySelectorAll('.shot')],caption=document.querySelector('#caption'),speaker=document.querySelector('#speaker'),line=document.querySelector('#line'),hint=document.querySelector('#hint'),choices=document.querySelector('#choices'),toplabel=document.querySelector('#toplabel'),fade=document.querySelector('#fade'),flicker=document.querySelector('#flicker');
    let si=0,queue=[],waitingChoice=false,locked=false,finished=false;
    function setDialogue(item){caption.classList.remove('show');setTimeout(()=>{if(!document.body.contains(caption))return;speaker.textContent=item.speaker;speaker.classList.toggle('player',item.speaker==='관리관');line.textContent=item.text;hint.textContent='화면을 터치하여 진행';caption.classList.add('show')},80)}
    function renderChoice(event){waitingChoice=true;hint.textContent='대답을 선택하세요';choices.innerHTML='';event.options.forEach(opt=>{const b=document.createElement('button');b.className='choice';b.textContent=opt.label;b.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();if(!waitingChoice)return;waitingChoice=false;choices.classList.remove('show');setTimeout(()=>{choices.innerHTML='';queue=[...opt.lines,...(event.after||[]),...queue];advance()},150)});choices.appendChild(b)});choices.classList.add('show')}
    function advance(){if(finished||waitingChoice)return;if(!queue.length){if(si<scenes.length-1){fade.classList.add('on');setTimeout(()=>{si++;show(si);fade.classList.remove('on')},420)}else handoff();return}const item=queue.shift();if(item.type==='choice'){renderChoice(item);return}setDialogue(item)}
    function show(index){const s=scenes[index];shots.forEach(x=>x.classList.toggle('active',x.dataset.scene===s.id));stage.dataset.env=s.env;toplabel.textContent=s.top;window.__CUTSCENE_QA__.activeScene=s.id;queue=[...s.script];waitingChoice=false;choices.classList.remove('show');choices.innerHTML='';flicker.classList.add('on');setTimeout(()=>flicker.classList.remove('on'),90);verify(s);advance()}
    function handoff(){if(finished)return;finished=true;window.__CUTSCENE_QA__.activeScene='HANDOFF';choices.classList.remove('show');fade.classList.add('on');setTimeout(()=>location.assign(MANAGEMENT_URL),480)}
    function next(){if(locked||finished||waitingChoice)return;locked=true;setTimeout(()=>locked=false,160);advance()}
    document.querySelector('#tap').addEventListener('pointerup',e=>{e.preventDefault();next()});document.querySelector('#skip').addEventListener('pointerup',e=>{e.preventDefault();handoff()});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!waitingChoice){e.preventDefault();next()}});show(0)
  }
  Promise.all(scenes.map(preload)).then(reports=>{window.__CUTSCENE_QA__.assets=reports;start()}).catch(err=>fatal('컷씬 리소스를 확인할 수 없습니다.',err.message));
})();
</script>
</body>
</html>
