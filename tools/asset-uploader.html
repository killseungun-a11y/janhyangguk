<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>잔향국 · 에셋 업로더</title>
<style>
:root{color-scheme:dark;--bg:#090a0d;--panel:#111318;--line:#30343b;--ink:#eee8de;--muted:#8f949a;--accent:#9a805d;--ok:#6e9b7d;--bad:#b55d63}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{padding:18px}.wrap{max-width:760px;margin:auto}.title{font-family:Georgia,"Batang",serif;font-size:26px;letter-spacing:.08em;margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:18px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#12151a,#0d0f13);border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:11px;color:#b8b2a8}input,select,button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:#0b0d10;color:var(--ink);padding:10px 12px;font:inherit}input:focus,select:focus{outline:1px solid var(--accent)}button{cursor:pointer}button.primary{background:linear-gradient(#201a14,#15120f);border-color:#7f694e;font-weight:700}button.secondary{background:#101319}button:disabled{opacity:.45;cursor:not-allowed}.tokenrow{display:grid;grid-template-columns:1fr auto;gap:8px}.drop{border:1px dashed #5a6068;border-radius:14px;padding:24px 14px;text-align:center;color:#a7abb0;transition:.15s;background:#0b0d10}.drop.drag{border-color:#b09a77;background:#14110e;color:#e7dbc8}.drop input{display:none}.drop strong{display:block;color:#ded7cc;margin-bottom:5px}.files{display:grid;gap:7px;margin-top:10px}.file{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid #252a31;background:#0b0d10;border-radius:9px;padding:8px 10px}.file small{color:#7f858c}.progress{height:7px;background:#07080a;border:1px solid #2b3037;border-radius:999px;overflow:hidden;margin-top:8px}.progress>div{height:100%;width:0;background:#867255;transition:width .15s}.status{font-size:12px;line-height:1.6;color:#aaa}.status.ok{color:#8db99a}.status.bad{color:#d48389}.log{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;max-height:210px;overflow:auto;background:#07080a;border:1px solid #22262c;border-radius:9px;padding:10px;color:#a9adb2}.notice{font-size:11px;color:#8b9096;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:150px}
@media(max-width:640px){body{padding:12px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.title{font-size:22px}.tokenrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">잔향국 · 에셋 업로더</div>
  <div class="sub">파일을 이 브라우저에서 바로 GitHub로 올립니다. ChatGPT를 거치지 않아서 대용량 PNG/ZIP 업로드가 훨씬 빠릅니다.</div>

  <section class="card">
    <div class="grid">
      <div class="field full">
        <label>GitHub Fine-grained PAT · 저장하지 않음</label>
        <div class="tokenrow"><input id="token" type="password" autocomplete="off" placeholder="github_pat_..."><button id="check" class="secondary">연결 확인</button></div>
      </div>
      <div class="field"><label>저장소</label><input id="repo" value="killseungun-a11y/janhyangguk"></div>
      <div class="field"><label>브랜치</label><input id="branch" value="main"></div>
      <div class="field full"><label>대상 폴더</label><input id="folder" value="resources/uploads" placeholder="resources/characters"></div>
      <div class="field full"><label>커밋 메시지</label><input id="message" value="assets: upload game assets"></div>
    </div>
    <p class="notice">토큰 권한은 이 저장소의 <b>Contents: Read and write</b>만 있으면 됩니다. 토큰 값은 localStorage/sessionStorage/cookie에 저장하지 않습니다.</p>
  </section>

  <section class="card">
    <label class="drop" id="drop"><input id="picker" type="file" multiple><strong>파일을 드래그하거나 눌러서 선택</strong>PNG · WEBP · JPG · WAV · MP3 · JSON · ZIP 등</label>
    <div id="files" class="files"></div>
  </section>

  <section class="card">
    <div class="actions"><button id="upload" class="primary">한 번에 커밋</button><button id="clear" class="secondary">목록 비우기</button></div>
    <div class="progress"><div id="bar"></div></div>
    <p id="status" class="status">대기 중</p>
    <div id="log" class="log">ready</div>
  </section>
</div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const token = $('#token'), repo = $('#repo'), branch = $('#branch'), folder = $('#folder'), message = $('#message');
  const picker = $('#picker'), drop = $('#drop'), filesEl = $('#files'), uploadBtn = $('#upload'), clearBtn = $('#clear');
  const statusEl = $('#status'), logEl = $('#log'), bar = $('#bar'), checkBtn = $('#check');
  let selected = [];

  const log = (m) => { logEl.textContent += '\n' + m; logEl.scrollTop = logEl.scrollHeight; };
  const setStatus = (m, type='') => { statusEl.textContent = m; statusEl.className = 'status ' + type; };
  const safeFolder = (v) => v.trim().replace(/^\/+|\/+$/g,'').replace(/\\/g,'/');
  const safeName = (v) => v.replace(/[\\/:*?"<>|]/g,'_');
  const pretty = (n) => n < 1024*1024 ? (n/1024).toFixed(1)+' KB' : (n/1024/1024).toFixed(1)+' MB';

  function renderFiles(){
    filesEl.innerHTML='';
    selected.forEach((f,i)=>{
      const row=document.createElement('div'); row.className='file';
      row.innerHTML=`<div><b>${f.name}</b><br><small>${pretty(f.size)}</small></div><button data-i="${i}" class="secondary">제거</button>`;
      filesEl.appendChild(row);
    });
    filesEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected.splice(Number(b.dataset.i),1);renderFiles();});
  }
  function addFiles(list){ selected.push(...[...list]); renderFiles(); }
  drop.onclick=()=>picker.click(); picker.onchange=()=>{addFiles(picker.files);picker.value='';};
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag');}));
  drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
  clearBtn.onclick=()=>{selected=[];renderFiles();bar.style.width='0%';setStatus('대기 중');logEl.textContent='ready';};

  async function gh(path, opts={}){
    const t=token.value.trim(); if(!t) throw new Error('토큰을 입력하세요.');
    const r=await fetch('https://api.github.com'+path,{...opts,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json',...(opts.headers||{})}});
    const text=await r.text(); let data={}; try{data=text?JSON.parse(text):{}}catch{data={message:text}};
    if(!r.ok) throw new Error(`${r.status} ${data.message||r.statusText}`);
    return data;
  }

  checkBtn.onclick=async()=>{
    checkBtn.disabled=true; setStatus('연결 확인 중...');
    try{const [owner,name]=repo.value.trim().split('/'); if(!owner||!name) throw new Error('저장소 형식은 owner/repo 입니다.');
      await gh(`/repos/${owner}/${name}/git/ref/heads/${encodeURIComponent(branch.value.trim())}`); setStatus('GitHub 연결 정상','ok'); log('connection ok');
    }catch(e){setStatus(e.message,'bad');log('ERROR '+e.message)}finally{checkBtn.disabled=false;}
  };

  function fileToBase64(file){
    return new Promise((resolve,reject)=>{
      const fr=new FileReader();
      fr.onerror=()=>reject(fr.error||new Error('파일 읽기 실패'));
      fr.onload=()=>{const s=String(fr.result);resolve(s.slice(s.indexOf(',')+1));};
      fr.readAsDataURL(file);
    });
  }

  async function uploadBlob(owner,name,file,index,total){
    setStatus(`파일 처리 중 ${index+1}/${total} · ${file.name}`);
    const base64=await fileToBase64(file);
    const blob=await gh(`/repos/${owner}/${name}/git/blobs`,{method:'POST',body:JSON.stringify({content:base64,encoding:'base64'})});
    log(`blob ${file.name} → ${blob.sha.slice(0,8)}`);
    return {path:[safeFolder(folder.value),safeName(file.name)].filter(Boolean).join('/'),mode:'100644',type:'blob',sha:blob.sha};
  }

  uploadBtn.onclick=async()=>{
    if(!selected.length){setStatus('파일을 먼저 선택하세요.','bad');return;}
    const [owner,name]=repo.value.trim().split('/'); if(!owner||!name){setStatus('저장소 형식을 확인하세요.','bad');return;}
    uploadBtn.disabled=clearBtn.disabled=checkBtn.disabled=true; bar.style.width='3%'; logEl.textContent='upload start';
    try{
      const br=branch.value.trim();
      const ref=await gh(`/repos/${owner}/${name}/git/ref/heads/${encodeURIComponent(br)}`); const head=ref.object.sha;
      const commit=await gh(`/repos/${owner}/${name}/git/commits/${head}`); const baseTree=commit.tree.sha;
      log(`base ${head.slice(0,8)}`); bar.style.width='8%';

      const entries=[];
      for(let i=0;i<selected.length;i++){
        entries.push(await uploadBlob(owner,name,selected[i],i,selected.length));
        bar.style.width=(8 + ((i+1)/selected.length)*67)+'%';
      }
      const tree=await gh(`/repos/${owner}/${name}/git/trees`,{method:'POST',body:JSON.stringify({base_tree:baseTree,tree:entries})});
      bar.style.width='82%'; log(`tree ${tree.sha.slice(0,8)}`);
      const newCommit=await gh(`/repos/${owner}/${name}/git/commits`,{method:'POST',body:JSON.stringify({message:message.value.trim()||'assets: upload',tree:tree.sha,parents:[head]})});
      bar.style.width='92%'; log(`commit ${newCommit.sha.slice(0,8)}`);
      await gh(`/repos/${owner}/${name}/git/refs/heads/${encodeURIComponent(br)}`,{method:'PATCH',body:JSON.stringify({sha:newCommit.sha,force:false})});
      bar.style.width='100%'; setStatus(`완료 · ${selected.length}개 파일 · ${newCommit.sha.slice(0,8)}`,'ok'); log('done');
    }catch(e){setStatus(e.message,'bad');log('ERROR '+e.message);bar.style.width='0%';}
    finally{uploadBtn.disabled=clearBtn.disabled=checkBtn.disabled=false;}
  };
})();
</script>
</body>
</html>
