<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer">
<title>잔향국 · 에셋 업로더</title>
<style>
:root{color-scheme:dark;--b:#090a0d;--p:#111318;--l:#30343b;--t:#eee8de;--m:#8f949a;--a:#9a805d;--ok:#8db99a;--bad:#d48389}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--b);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:780px;margin:auto}.title{font:26px Georgia,"Batang",serif;letter-spacing:.07em;margin:8px 0}.sub,.note,.status{color:var(--m);font-size:12px;line-height:1.6}.card{border:1px solid var(--l);background:linear-gradient(#12151a,#0d0f13);border-radius:14px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:6px}label{font-size:11px;color:#bbb4a9}input,select,button{min-height:44px;border:1px solid var(--l);border-radius:10px;background:#0b0d10;color:var(--t);padding:10px 12px;font:inherit}button{cursor:pointer}.primary{border-color:#7f694e;background:#1b1712;font-weight:700}.danger{border-color:#674248;color:#d9a4a7}.token{display:grid;grid-template-columns:1fr auto auto;gap:8px}.remember{display:flex;align-items:center;gap:7px;margin-top:8px}.remember input{min-height:auto;width:16px;height:16px}.route{padding:10px 12px;border:1px solid #282d34;border-radius:10px;background:#090b0e;color:#dac7aa;font:12px ui-monospace,monospace;word-break:break-all}.drop{display:block;padding:26px 14px;border:1px dashed #5a6068;border-radius:14px;text-align:center;color:#aaa;background:#0b0d10}.drop.drag{border-color:#b09a77;background:#14110e}.drop input{display:none}.files{display:grid;gap:7px;margin-top:10px}.file{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 10px;border:1px solid #252a31;border-radius:9px;background:#0b0d10}.file small{color:#7f858c}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:150px}.bar{height:7px;border:1px solid #2b3037;border-radius:99px;background:#07080a;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:#867255}.log{max-height:190px;overflow:auto;white-space:pre-wrap;padding:10px;border:1px solid #22262c;border-radius:9px;background:#07080a;color:#a9adb2;font:11px ui-monospace,monospace}.ok{color:var(--ok)}.bad{color:var(--bad)}.badge{display:inline-block;padding:4px 8px;border:1px solid #466451;border-radius:99px;color:#91b89b;font-size:11px;margin-bottom:10px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.token{grid-template-columns:1fr 1fr}.token input{grid-column:1/-1}.title{font-size:22px}}
</style>
</head>
<body><div class="wrap">
<div class="title">잔향국 · 에셋 업로더</div>
<div class="sub">브라우저와 GPT가 <b>assets/asset-routing.json</b>을 같은 정본 규칙으로 사용합니다. 분류만 고르면 저장 경로는 자동 결정됩니다.</div>
<section class="card"><span id="badge" class="badge">라우팅 규칙 확인 중</span><div class="grid">
<div class="field"><label>에셋 종류</label><select id="type"></select></div>
<div class="field" id="subjectBox"><label id="subjectLabel">대상</label><select id="subject"></select><input id="subjectText" hidden spellcheck="false"></div>
<div class="field" id="stateBox"><label>상태 / 용도</label><select id="state"></select></div>
<div class="field"><label>커밋 메시지</label><input id="message" value="assets: upload game assets"></div>
<div class="full route">정본 경로 · <span id="route">assets/inbox/</span></div>
</div><p class="note">애매한 파일은 <b>임시 inbox</b>로 올리면 됩니다. GPT 업로드도 이 경로 규칙을 그대로 사용합니다.</p></section>
<section class="card"><div class="field"><label>GitHub Fine-grained PAT · 브라우저 업로드 전용</label><div class="token"><input id="token" type="password" autocomplete="off" placeholder="github_pat_..."><button id="check">연결 확인</button><button id="disconnect" class="danger">연결 해제</button></div><label class="remember"><input id="remember" type="checkbox" checked> 이 기기에서 연결 유지</label></div><div class="grid"><div class="field"><label>저장소</label><input id="repo" value="killseungun-a11y/janhyangguk"></div><div class="field"><label>브랜치</label><input id="branch" value="main"></div></div><p class="note">PAT는 현재 브라우저에만 저장됩니다. GPT는 이 PAT를 읽지 않고 ChatGPT의 GitHub 연결 권한으로 업로드합니다. 토큰을 채팅에 보내지 마세요.</p></section>
<section class="card"><label id="drop" class="drop"><input id="picker" type="file" multiple><b>파일을 드래그하거나 눌러서 선택</b><br><small>PNG · WEBP · JPG · WAV · MP3 · JSON · ZIP 등</small></label><div id="files" class="files"></div></section>
<section class="card"><div class="actions"><button id="upload" class="primary">정본 경로에 한 번에 커밋</button><button id="clear">목록 비우기</button></div><div class="bar"><i id="bar"></i></div><p id="status" class="status">대기 중</p><div id="log" class="log">ready</div></section>
</div><script>
(()=>{
const $=s=>document.querySelector(s),STORE='janhyangguk.assetUploader.connection.v2',OLD='janhyangguk.assetUploader.connection.v1';
const token=$('#token'),repo=$('#repo'),branch=$('#branch'),remember=$('#remember'),type=$('#type'),subject=$('#subject'),subjectText=$('#subjectText'),subjectBox=$('#subjectBox'),subjectLabel=$('#subjectLabel'),state=$('#state'),stateBox=$('#stateBox'),routeEl=$('#route'),message=$('#message'),picker=$('#picker'),drop=$('#drop'),filesEl=$('#files'),upload=$('#upload'),clear=$('#clear'),check=$('#check'),disconnect=$('#disconnect'),status=$('#status'),bar=$('#bar'),logEl=$('#log'),badge=$('#badge');
let routing={root:'assets',types:{inbox:{label:'임시 inbox',path:'inbox'}}},selected=[];
const log=m=>{logEl.textContent+='\n'+m;logEl.scrollTop=logEl.scrollHeight},setStatus=(m,c='')=>{status.textContent=m;status.className='status '+c},safeSeg=v=>String(v||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9._-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')||'misc',safeName=v=>v.replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_'),pretty=n=>n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
function fill(el,items=[]){el.innerHTML='';items.forEach(x=>{const o=document.createElement('option');o.value=x.slug;o.textContent=x.label||x.slug;el.appendChild(o)})}
function def(){return routing.types[type.value]||routing.types.inbox}
function currentSubject(){return def().subjectMode==='text'?safeSeg(subjectText.value):safeSeg(subject.value)}
function route(){let p=def().path||'inbox';p=p.replace('{subject}',currentSubject()).replace('{state}',safeSeg(state.value));return [routing.root||'assets',p].join('/').replace(/\/+/g,'/')}
function preview(){routeEl.textContent=route()+'/';renderFiles()}
function controls(){const d=def(),hs=/\{subject\}/.test(d.path||''),ht=/\{state\}/.test(d.path||'');subjectBox.hidden=!hs;stateBox.hidden=!ht;if(hs){const text=d.subjectMode==='text';subject.hidden=text;subjectText.hidden=!text;subjectLabel.textContent=d.subjectLabel||'대상';if(text){subjectText.placeholder=d.subjectPlaceholder||'slug';if(!subjectText.value)subjectText.value=d.subjectPlaceholder||''}else fill(subject,d.subjects)}if(ht)fill(state,d.states);preview()}
async function loadRouting(){try{const r=await fetch('../assets/asset-routing.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);routing=await r.json();badge.textContent='asset-routing.json 연결됨'}catch(e){badge.textContent='라우팅 파일 오류 · inbox만 사용';log('routing error '+e.message)}type.innerHTML='';Object.entries(routing.types).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.label||k;type.appendChild(o)});if(routing.types.employee)type.value='employee';controls()}
type.onchange=controls;subject.onchange=preview;subjectText.oninput=preview;state.onchange=preview;
function save(){if(!remember.checked){localStorage.removeItem(STORE);localStorage.removeItem(OLD);return}const d={token:token.value.trim(),repo:repo.value.trim(),branch:branch.value.trim()};if(d.token)localStorage.setItem(STORE,JSON.stringify(d))}
function restore(){try{const raw=localStorage.getItem(STORE)||localStorage.getItem(OLD);if(!raw)return false;const d=JSON.parse(raw);if(!d.token)return false;token.value=d.token;if(d.repo)repo.value=d.repo;if(d.branch)branch.value=d.branch;remember.checked=true;setStatus('저장된 GitHub 연결을 불러왔습니다.','ok');return true}catch{return false}}
disconnect.onclick=()=>{localStorage.removeItem(STORE);localStorage.removeItem(OLD);token.value='';remember.checked=false;setStatus('연결 정보를 삭제했습니다.')};remember.onchange=()=>{if(!remember.checked){localStorage.removeItem(STORE);localStorage.removeItem(OLD)}};
function renderFiles(){filesEl.innerHTML='';selected.forEach((f,i)=>{const row=document.createElement('div');row.className='file';row.innerHTML=`<div><b>${f.name}</b><br><small>${pretty(f.size)} · ${route()}/${safeName(f.name)}</small></div><button data-i="${i}">제거</button>`;filesEl.appendChild(row)});filesEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected.splice(+b.dataset.i,1);renderFiles()})}
function add(fs){selected.push(...[...fs]);renderFiles()}drop.onclick=()=>picker.click();picker.onchange=()=>{add(picker.files);picker.value=''};['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>add(e.dataTransfer.files));clear.onclick=()=>{selected=[];renderFiles();bar.style.width='0';setStatus('대기 중');logEl.textContent='ready'};
async function gh(path,opt={}){const t=token.value.trim();if(!t)throw Error('토큰을 입력하세요.');const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json',...(opt.headers||{})}}),txt=await r.text();let d={};try{d=txt?JSON.parse(txt):{}}catch{d={message:txt}}if(!r.ok)throw Error(`${r.status} ${d.message||r.statusText}`);return d}
async function verify(auto=false){check.disabled=true;setStatus(auto?'저장된 연결 확인 중...':'연결 확인 중...');try{const [o,n]=repo.value.trim().split('/');if(!o||!n)throw Error('저장소 형식은 owner/repo 입니다.');await gh(`/repos/${o}/${n}/git/ref/heads/${encodeURIComponent(branch.value.trim())}`);save();setStatus(remember.checked?'GitHub 연결 정상 · 이 기기에 저장됨':'GitHub 연결 정상','ok');return true}catch(e){setStatus(e.message,'bad');log('ERROR '+e.message);return false}finally{check.disabled=false}}check.onclick=()=>verify(false);
function b64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(r.error);r.onload=()=>res(String(r.result).split(',')[1]);r.readAsDataURL(file)})}
upload.onclick=async()=>{if(!selected.length)return setStatus('파일을 먼저 선택하세요.','bad');const [o,n]=repo.value.trim().split('/');if(!o||!n)return setStatus('저장소 형식을 확인하세요.','bad');const dst=route();upload.disabled=clear.disabled=check.disabled=disconnect.disabled=true;bar.style.width='3%';logEl.textContent='upload start\nroute '+dst;try{save();const br=branch.value.trim(),ref=await gh(`/repos/${o}/${n}/git/ref/heads/${encodeURIComponent(br)}`),head=ref.object.sha,commit=await gh(`/repos/${o}/${n}/git/commits/${head}`),entries=[];for(let i=0;i<selected.length;i++){setStatus(`파일 처리 중 ${i+1}/${selected.length} · ${selected[i].name}`);const blob=await gh(`/repos/${o}/${n}/git/blobs`,{method:'POST',body:JSON.stringify({content:await b64(selected[i]),encoding:'base64'})});entries.push({path:dst+'/'+safeName(selected[i].name),mode:'100644',type:'blob',sha:blob.sha});bar.style.width=(8+(i+1)/selected.length*67)+'%'}const tree=await gh(`/repos/${o}/${n}/git/trees`,{method:'POST',body:JSON.stringify({base_tree:commit.tree.sha,tree:entries})});bar.style.width='82%';const c=await gh(`/repos/${o}/${n}/git/commits`,{method:'POST',body:JSON.stringify({message:(message.value.trim()||'assets: upload')+` [${type.value}]`,tree:tree.sha,parents:[head]})});bar.style.width='92%';await gh(`/repos/${o}/${n}/git/refs/heads/${encodeURIComponent(br)}`,{method:'PATCH',body:JSON.stringify({sha:c.sha,force:false})});bar.style.width='100%';setStatus(`완료 · ${selected.length}개 · ${dst} · ${c.sha.slice(0,8)}`,'ok');log('done '+c.sha)}catch(e){bar.style.width='0';setStatus(e.message,'bad');log('ERROR '+e.message)}finally{upload.disabled=clear.disabled=check.disabled=disconnect.disabled=false}};
loadRouting().then(()=>{if(restore())verify(true)});
})();
</script></body></html>
